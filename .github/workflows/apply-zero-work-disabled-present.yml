name: Apply zero-work disabled present fix

on:
  push:
    branches:
      - fix/off-state-present-hitch
    paths:
      - .github/workflows/apply-zero-work-disabled-present.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/off-state-present-hitch
          fetch-depth: 0

      - name: Establish red contract
        shell: bash
        run: |
          set -euo pipefail
          if python3 tests/android_present_io_contract_test.py; then
            echo "Expected zero-work present contract to fail before implementation" >&2
            exit 1
          fi

      - name: Apply minimal hitch-path fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hooks.cpp')
          text = path.read_text()

          text = text.replace('#include <unordered_map>\n#include <filesystem>', '#include <unordered_map>\n#include <unordered_set>\n#include <filesystem>')
          text = text.replace('#include <chrono>\n#include <condition_variable>', '#include <chrono>\n#include <condition_variable>\n#include <atomic>')
          text = text.replace('#include <sys/inotify.h>\n#include <unistd.h>', '#include <sys/inotify.h>\n#include <poll.h>\n#include <unistd.h>')

          start = text.index('    class AndroidConfigWatcher {')
          end_marker = '    AndroidConfigWatcher androidConfigWatcher;\n'
          end = text.index(end_marker, start) + len(end_marker)
          watcher = r'''    class AndroidConfigWatcher {
    public:
        ~AndroidConfigWatcher() {
            reset();
        }

        void watch(const std::string& configFile) noexcept {
            if (configFile.empty())
                return;
            if (configFile == configFile_ && worker_.joinable())
                return;

            reset();
            configFile_ = configFile;
            const std::filesystem::path path(configFile);
            directory_ = path.parent_path().string();
            filename_ = path.filename().string();

            fd_ = ::inotify_init1(IN_NONBLOCK | IN_CLOEXEC);
            if (fd_ >= 0) {
                wd_ = ::inotify_add_watch(fd_, directory_.c_str(),
                    IN_CLOSE_WRITE | IN_MOVED_TO | IN_CREATE | IN_DELETE | IN_ATTRIB |
                    IN_MOVE_SELF | IN_DELETE_SELF);
                if (wd_ < 0) {
                    ::close(fd_);
                    fd_ = -1;
                }
            }

            std::error_code ec;
            fallbackTimestamp_ = std::filesystem::last_write_time(configFile_, ec);
            fallbackTimestampValid_ = !ec;
            stopping_.store(false, std::memory_order_release);
            changed_.store(false, std::memory_order_release);
            worker_ = std::thread(&AndroidConfigWatcher::run, this);
        }

        bool consumeChanged() noexcept {
            return changed_.exchange(false, std::memory_order_acq_rel);
        }

    private:
        void run() noexcept {
            auto nextFallbackPoll = std::chrono::steady_clock::now();
            while (!stopping_.load(std::memory_order_acquire)) {
                bool sawChange = false;
                if (fd_ >= 0 && wd_ >= 0) {
                    struct pollfd descriptor { fd_, POLLIN, 0 };
                    const int ready = ::poll(&descriptor, 1, 250);
                    if (ready > 0 && (descriptor.revents & POLLIN)) {
                        alignas(struct inotify_event) char buffer[4096];
                        for (;;) {
                            const ssize_t length = ::read(fd_, buffer, sizeof(buffer));
                            if (length < 0) {
                                if (errno == EAGAIN || errno == EWOULDBLOCK)
                                    break;
                                break;
                            }
                            if (length == 0)
                                break;
                            size_t offset = 0;
                            while (offset < static_cast<size_t>(length)) {
                                const auto* event = reinterpret_cast<const struct inotify_event*>(
                                    buffer + offset);
                                const bool matchingName = event->len > 0 && filename_ == event->name;
                                if (matchingName && (event->mask & (
                                        IN_CLOSE_WRITE | IN_MOVED_TO | IN_CREATE | IN_DELETE |
                                        IN_ATTRIB | IN_MOVE_SELF | IN_DELETE_SELF)))
                                    sawChange = true;
                                offset += sizeof(struct inotify_event) + event->len;
                            }
                        }
                    }
                } else {
                    std::this_thread::sleep_for(std::chrono::milliseconds(250));
                }

                const auto now = std::chrono::steady_clock::now();
                if (fd_ < 0 && now >= nextFallbackPoll) {
                    nextFallbackPoll = now + std::chrono::seconds(1);
                    std::error_code ec;
                    const auto timestamp = std::filesystem::last_write_time(configFile_, ec);
                    const bool valid = !ec;
                    if (valid != fallbackTimestampValid_
                            || (valid && timestamp != fallbackTimestamp_))
                        sawChange = true;
                    fallbackTimestamp_ = timestamp;
                    fallbackTimestampValid_ = valid;
                }

                if (sawChange)
                    changed_.store(true, std::memory_order_release);
            }
        }

        void reset() noexcept {
            stopping_.store(true, std::memory_order_release);
            if (worker_.joinable())
                worker_.join();
            if (fd_ >= 0 && wd_ >= 0)
                ::inotify_rm_watch(fd_, wd_);
            if (fd_ >= 0)
                ::close(fd_);
            fd_ = -1;
            wd_ = -1;
            directory_.clear();
            filename_.clear();
            configFile_.clear();
        }

        int fd_{-1};
        int wd_{-1};
        std::string directory_;
        std::string filename_;
        std::string configFile_;
        std::thread worker_;
        std::atomic<bool> stopping_{false};
        std::atomic<bool> changed_{false};
        std::filesystem::file_time_type fallbackTimestamp_{};
        bool fallbackTimestampValid_{false};
    };

    AndroidConfigWatcher androidConfigWatcher;
    std::atomic<bool> androidFrameGenerationActive{false};
'''
          text = text[:start] + watcher + text[end:]

          anchor = '    std::unordered_map<VkSwapchainKHR, VkPresentModeKHR> swapchainToConfiguredPresent;\n'
          text = text.replace(anchor, anchor + '    std::unordered_set<VkSwapchainKHR> passThroughSwapchains;\n')
          text = text.replace('        swapchainToConfiguredPresent.erase(swapchain);\n', '        swapchainToConfiguredPresent.erase(swapchain);\n        passThroughSwapchains.erase(swapchain);\n')

          text = text.replace('        const auto& activeConf = Config::activeConf;\n\n        const auto createPassThrough', '''        const auto& activeConf = Config::activeConf;
#ifdef __ANDROID__
        androidConfigWatcher.watch(activeConf.config_file);
        androidFrameGenerationActive.store(
            activeConf.enable && activeConf.multiplier > 1,
            std::memory_order_release);
#endif

        const auto createPassThrough''')
          text = text.replace('                swapchainToDeviceTable.emplace(*pSwapchain, device);\n#ifdef __ANDROID__\n                publishRuntimeState', '                swapchainToDeviceTable.emplace(*pSwapchain, device);\n                passThroughSwapchains.insert(*pSwapchain);\n#ifdef __ANDROID__\n                publishRuntimeState')
          text = text.replace('            swapchainToDeviceTable.emplace(*pSwapchain, device);\n            std::cerr << "lsfg-vk: init stage=ls-context-begin', '            swapchainToDeviceTable.emplace(*pSwapchain, device);\n            passThroughSwapchains.erase(*pSwapchain);\n            std::cerr << "lsfg-vk: init stage=ls-context-begin')
          text = text.replace('                swapchainToDeviceTable.emplace(*pSwapchain, device);\n#ifdef __ANDROID__\n                publishRuntimeState(activeConf.config_file, false, false,', '                swapchainToDeviceTable.emplace(*pSwapchain, device);\n                passThroughSwapchains.insert(*pSwapchain);\n#ifdef __ANDROID__\n                publishRuntimeState(activeConf.config_file, false, false,')

          present_start = text.index('    VkResult myvkQueuePresentKHR(')
          lookup = text.index('        auto it3 = swapchains.find(*pPresentInfo->pSwapchains);', present_start)
          prefix = r'''    VkResult myvkQueuePresentKHR(
            VkQueue queue,
            const VkPresentInfoKHR* pPresentInfo) noexcept {
        if (pPresentInfo == nullptr || pPresentInfo->swapchainCount == 0
                || pPresentInfo->pSwapchains == nullptr)
            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);

        auto& conf = Config::activeConf;
#ifdef __ANDROID__
        const bool shouldPollConfig = androidConfigWatcher.consumeChanged();
#else
        const bool shouldPollConfig = true;
#endif
        if (shouldPollConfig && !conf.config_file.empty()) {
            const std::string configFile = conf.config_file;
            const auto previousConf = conf;
            bool recreateSwapchain = false;
            std::error_code configEc;
            const bool configExists = std::filesystem::exists(configFile, configEc) && !configEc;
            if (configExists) {
                try {
                    Config::updateConfig(configFile);
                    Config::activeConf = Config::getConfig(Utils::getProcessName());
                    recreateSwapchain = requiresSwapchainRecreation(
                        previousConf, Config::activeConf);
                    std::cerr << "lsfg-vk: init stage=config-reloaded multiplier="
                              << Config::activeConf.multiplier
                              << " adaptive=" << (Config::activeConf.adaptiveFramegen ? 1 : 0)
                              << " targetFps=" << Config::activeConf.fpsLimit
                              << " presentMode=" << Config::activeConf.e_present
                              << " enabled=" << (Config::activeConf.enable ? 1 : 0)
                              << " recreateSwapchain=" << (recreateSwapchain ? 1 : 0)
                              << "\n";
                } catch (const std::exception& e) {
                    Utils::logLimitN("configReload", 5,
                        "Failed to hot-reload configuration; preserving the active runtime:\n- "
                        + std::string(e.what()));
                }
            } else {
                recreateSwapchain = true;
            }
#ifdef __ANDROID__
            androidConfigWatcher.watch(Config::activeConf.config_file);
            androidFrameGenerationActive.store(
                Config::activeConf.enable && Config::activeConf.multiplier > 1,
                std::memory_order_release);
#endif
            if (recreateSwapchain) {
#ifdef __ANDROID__
                publishRuntimeState(configFile, false, false,
                    static_cast<int>(Config::activeConf.multiplier),
                    Config::activeConf.performance,
                    Config::activeConf.adaptiveFramegen,
                    Config::activeConf.fpsLimit);
#endif
                Layer::ovkQueuePresentKHR(queue, pPresentInfo);
                return VK_ERROR_OUT_OF_DATE_KHR;
            }
        }

#ifdef __ANDROID__
        if (!androidFrameGenerationActive.load(std::memory_order_acquire))
            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);
        if (passThroughSwapchains.find(*pPresentInfo->pSwapchains)
                != passThroughSwapchains.end())
            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);
#else
        if (!conf.enable || conf.multiplier <= 1)
            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);
#endif

        auto it = swapchainToDeviceTable.find(*pPresentInfo->pSwapchains);
        if (it == swapchainToDeviceTable.end()) {
            Utils::logLimitN("swapMap", 5,
                "Swapchain not found in map");
            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);
        }

        auto it2 = deviceToInfo.find(it->second);
        if (it2 == deviceToInfo.end()) {
            Utils::logLimitN("swapMap", 5,
                "Device not found in map");
            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);
        }
        auto& deviceInfo = it2->second;
#ifdef __ANDROID__
        auto& runtimeStats = runtimeOutputStats[*pPresentInfo->pSwapchains];
#endif

'''
          text = text[:present_start] + prefix + text[lookup:]
          path.write_text(text)
          PY

      - name: Verify focused contracts
        run: |
          set -euo pipefail
          python3 tests/android_present_io_contract_test.py
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_ahb_portability_test.py
          python3 tests/android_wsi_loader_bridge_test.py
          python3 tests/android_wsi_provenance_test.py
          python3 tests/android_capability_architecture_test.py

      - name: Persist source fix and remove staging workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks.cpp tests/android_present_io_contract_test.py
          git rm .github/workflows/apply-zero-work-disabled-present.yml
          git commit -m "fix(android): make disabled present path zero-work"
          git push origin HEAD:fix/off-state-present-hitch
