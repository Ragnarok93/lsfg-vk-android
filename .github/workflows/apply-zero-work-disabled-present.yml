name: Apply zero-work disabled present fix

on:
  push:
    branches:
      - fix/off-state-present-hitch
    paths:
      - .github/workflows/apply-zero-work-disabled-present.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/off-state-present-hitch
          fetch-depth: 0

      - name: Establish red contract
        shell: bash
        run: |
          set -euo pipefail
          if python3 tests/android_present_io_contract_test.py; then
            echo "Expected zero-work present contract to fail before implementation" >&2
            exit 1
          fi

      - name: Apply minimal hitch-path fix
        run: python3 scripts/apply_zero_work_hitch.py

      - name: Verify focused contracts
        run: |
          set -euo pipefail
          python3 tests/android_present_io_contract_test.py
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_ahb_portability_test.py
          python3 tests/android_wsi_loader_bridge_test.py
          python3 tests/android_wsi_provenance_test.py
          python3 tests/android_capability_architecture_test.py

      - name: Persist source fix and remove staging helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks.cpp tests/android_present_io_contract_test.py
          git rm scripts/apply_zero_work_hitch.py .github/workflows/apply-zero-work-disabled-present.yml
          git commit -m "fix(android): make disabled present path zero-work"
          git push origin HEAD:fix/off-state-present-hitch
