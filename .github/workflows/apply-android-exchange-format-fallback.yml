name: Apply Android LSFG exchange format fallback

on:
  push:
    branches:
      - Adaptive-Frame-Generation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage Android exchange format fallback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0
      - name: Add capability-selected Android exchange format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tests_path = Path('tests/android_hot_reload_capability_cache_test.py')
          tests = tests_path.read_text()
          marker = '''    def test_performance_backend_toggle_requires_context_recreation(self) -> None:\n'''
          new_test = '''    def test_android_exchange_format_falls_back_to_rgba8_when_float_blit_is_unavailable(self) -> None:\n        hooks = (ROOT / "src/hooks.cpp").read_text(encoding="utf-8")\n        context_h = (ROOT / "include/context.hpp").read_text(encoding="utf-8")\n        context_cpp = (ROOT / "src/context.cpp").read_text(encoding="utf-8")\n\n        self.assertIn("selectSharedFormatForSwapchain", hooks)\n        self.assertIn("VK_FORMAT_R16G16B16A16_SFLOAT", hooks)\n        self.assertIn("VK_FORMAT_R8G8B8A8_UNORM", hooks)\n        self.assertIn("exchange-format-fallback", hooks)\n        self.assertIn("VkFormat sharedFormat", context_h)\n        self.assertIn("const VkFormat format = sharedFormat", context_cpp)\n\n'''
          if 'test_android_exchange_format_falls_back_to_rgba8' not in tests:
              if marker not in tests:
                  raise SystemExit('test insertion anchor not found')
              tests = tests.replace(marker, new_test + marker, 1)
          tests_path.write_text(tests)

          header_path = Path('include/context.hpp')
          header = header_path.read_text()
          old_header = '''    LsContext(const Hooks::DeviceInfo& info, VkSwapchainKHR swapchain,\n        VkExtent2D extent, const std::vector<VkImage>& swapchainImages);'''
          new_header = '''    LsContext(const Hooks::DeviceInfo& info, VkSwapchainKHR swapchain,\n        VkExtent2D extent, const std::vector<VkImage>& swapchainImages,\n        VkFormat sharedFormat);'''
          if old_header not in header:
              raise SystemExit('context declaration anchor not found')
          header = header.replace(old_header, new_header, 1)
          header_path.write_text(header)

          context_path = Path('src/context.cpp')
          context = context_path.read_text()
          old_ctor = '''LsContext::LsContext(const Hooks::DeviceInfo& info, VkSwapchainKHR swapchain,\n        VkExtent2D extent, const std::vector<VkImage>& swapchainImages)\n        : swapchain(swapchain), swapchainImages(swapchainImages),\n          extent(extent) {'''
          new_ctor = '''LsContext::LsContext(const Hooks::DeviceInfo& info, VkSwapchainKHR swapchain,\n        VkExtent2D extent, const std::vector<VkImage>& swapchainImages,\n        VkFormat sharedFormat)\n        : swapchain(swapchain), swapchainImages(swapchainImages),\n          extent(extent) {'''
          if old_ctor not in context:
              raise SystemExit('context constructor anchor not found')
          context = context.replace(old_ctor, new_ctor, 1)
          old_format = '''    // we could take the format from the swapchain,\n    // but honestly this is safer.\n    const VkFormat format = conf.hdr\n        ? VK_FORMAT_R8G8B8A8_UNORM\n        : VK_FORMAT_R16G16B16A16_SFLOAT;'''
          new_format = '''    // The WSI hook selects an exchange format that both the game device and\n    // framegen device can transport. On Android this may intentionally fall\n    // back from RGBA16F to RGBA8 when the stock ICD cannot blit the float\n    // format to the game's swapchain format.\n    if (sharedFormat == VK_FORMAT_UNDEFINED)\n        throw LSFG::vulkan_error(VK_ERROR_FORMAT_NOT_SUPPORTED,\n            "No compatible LSFG exchange format was selected");\n    const VkFormat format = sharedFormat;'''
          if old_format not in context:
              raise SystemExit('context format anchor not found')
          context = context.replace(old_format, new_format, 1)
          context_path.write_text(context)

          hooks_path = Path('src/hooks.cpp')
          hooks = hooks_path.read_text()
          selector_anchor = '''bool supportsBidirectionalBlit(VkPhysicalDevice physicalDevice,\n        VkFormat sharedFormat, VkFormat swapchainFormat) {'''
          if selector_anchor not in hooks:
              raise SystemExit('blit helper anchor not found')
          selector_end = '''    blitCapabilityCache.emplace(key, supported);\n    return supported;\n}\n\n    VkResult myvkCreateSwapchainKHR'''
          selector_replacement = '''    blitCapabilityCache.emplace(key, supported);\n    return supported;\n}\n\nVkFormat selectSharedFormatForSwapchain(VkPhysicalDevice physicalDevice,\n        VkFormat swapchainFormat, bool hdr) {\n    const VkFormat preferred = hdr\n        ? VK_FORMAT_R8G8B8A8_UNORM\n        : VK_FORMAT_R16G16B16A16_SFLOAT;\n    if (supportsBidirectionalBlit(physicalDevice, preferred, swapchainFormat))\n        return preferred;\n\n#ifdef __ANDROID__\n    // The Android AHB backend explicitly supports/probes RGBA8 as a storage or\n    // transport image. Use it as a lower-precision SDR exchange format when a\n    // stock ICD cannot bidirectionally blit RGBA16F to the game swapchain.\n    if (!hdr && preferred != VK_FORMAT_R8G8B8A8_UNORM\n            && supportsBidirectionalBlit(physicalDevice,\n                VK_FORMAT_R8G8B8A8_UNORM, swapchainFormat)) {\n        std::cerr << "lsfg-vk: init stage=exchange-format-fallback preferred="\n                  << preferred << " selected=" << VK_FORMAT_R8G8B8A8_UNORM\n                  << " swapchainFormat=" << swapchainFormat << "\\n";\n        return VK_FORMAT_R8G8B8A8_UNORM;\n    }\n#endif\n    return VK_FORMAT_UNDEFINED;\n}\n\n    VkResult myvkCreateSwapchainKHR'''
          if selector_end not in hooks:
              raise SystemExit('blit helper end anchor not found')
          hooks = hooks.replace(selector_end, selector_replacement, 1)

          old_select = '''        const VkFormat sharedFormat = activeConf.hdr\n            ? VK_FORMAT_R8G8B8A8_UNORM\n            : VK_FORMAT_R16G16B16A16_SFLOAT;\n        std::cerr << "lsfg-vk: init stage=swapchain-blit-check-begin sharedFormat="\n                  << sharedFormat << " swapchainFormat=" << pCreateInfo->imageFormat << "\\n";\n        if (!supportsBidirectionalBlit(\n                deviceInfo.physicalDevice, sharedFormat, pCreateInfo->imageFormat)) {\n            std::cerr << "lsfg-vk: init stage=blit-format-unsupported sharedFormat="\n                      << sharedFormat << " swapchainFormat=" << pCreateInfo->imageFormat\n                      << "; preserving original swapchain\\n";\n            return createPassThrough("blit-unsupported");\n        }\n        std::cerr << "lsfg-vk: init stage=swapchain-blit-check-ready\\n";'''
          new_select = '''        const VkFormat sharedFormat = selectSharedFormatForSwapchain(\n            deviceInfo.physicalDevice, pCreateInfo->imageFormat, activeConf.hdr);\n        std::cerr << "lsfg-vk: init stage=swapchain-blit-check-begin sharedFormat="\n                  << sharedFormat << " swapchainFormat=" << pCreateInfo->imageFormat << "\\n";\n        if (sharedFormat == VK_FORMAT_UNDEFINED) {\n            const VkFormat preferredSharedFormat = activeConf.hdr\n                ? VK_FORMAT_R8G8B8A8_UNORM\n                : VK_FORMAT_R16G16B16A16_SFLOAT;\n            std::cerr << "lsfg-vk: init stage=blit-format-unsupported sharedFormat="\n                      << preferredSharedFormat << " swapchainFormat=" << pCreateInfo->imageFormat\n                      << "; preserving original swapchain\\n";\n            return createPassThrough("blit-unsupported");\n        }\n        std::cerr << "lsfg-vk: init stage=swapchain-blit-check-ready sharedFormat="\n                  << sharedFormat << "\\n";'''
          if old_select not in hooks:
              raise SystemExit('shared format selection anchor not found')
          hooks = hooks.replace(old_select, new_select, 1)

          old_ctx_call = '''            swapchains.emplace(*pSwapchain, LsContext(\n                deviceInfo, *pSwapchain, pCreateInfo->imageExtent,\n                swapchainImages\n            ));'''
          new_ctx_call = '''            swapchains.emplace(*pSwapchain, LsContext(\n                deviceInfo, *pSwapchain, pCreateInfo->imageExtent,\n                swapchainImages, sharedFormat\n            ));'''
          if old_ctx_call not in hooks:
              raise SystemExit('LsContext call anchor not found')
          hooks = hooks.replace(old_ctx_call, new_ctx_call, 1)
          hooks_path.write_text(hooks)
          PY
      - name: Run focused regression contracts
        run: |
          python3 tests/android_hot_reload_capability_cache_test.py
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_ahb_portability_test.py
      - name: Commit format fallback
        shell: bash
        run: |
          rm .github/workflows/apply-android-exchange-format-fallback.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(android): select compatible LSFG exchange format"
          git push origin HEAD:Adaptive-Frame-Generation
