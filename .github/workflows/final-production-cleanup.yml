name: Final production cleanup

on:
  push:
    branches:
      - feature/adreno-6xx-b14-directional-ahb-adaptive-reload

permissions:
  contents: write

concurrency:
  group: final-production-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Strip development-only production instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          build = Path('scripts/build/android.sh')
          text = build.read_text(encoding='utf-8')
          text = text.replace(
              'MIPMAPS_CANDIDATE_SCRIPT="${LSFGVK_MIPMAPS_CANDIDATE_SCRIPT:-}"',
              'MIPMAPS_CANDIDATE_SCRIPT="${LSFGVK_MIPMAPS_CANDIDATE_SCRIPT:-scripts/apply-candidate-b14-mipmaps-tail-fusion.py}"',
              1,
          )
          text = text.replace(
              'ADAPTIVE_RUNTIME="${LSFGVK_ADAPTIVE_RUNTIME:-0}"',
              'ADAPTIVE_RUNTIME="${LSFGVK_ADAPTIVE_RUNTIME:-1}"',
              1,
          )
          coupling = '''if [[ -n "${MIPMAPS_CANDIDATE_SCRIPT}" && "${B12_DUAL_STAGE_PROFILE}" != "1" ]]; then
              echo "error: LSFGVK_MIPMAPS_CANDIDATE_SCRIPT requires LSFGVK_B12_DUAL_STAGE_PROFILE=1" >&2
              exit 1
          fi
          '''
          if coupling not in text:
              raise SystemExit('build/android.sh: B12/candidate coupling anchor missing')
          text = text.replace(coupling, '', 1)
          build.write_text(text, encoding='utf-8')

          evidence = Path('scripts/apply-adreno-evidence-profile.py')
          text = evidence.read_text(encoding='utf-8')
          old = '''    patch_hooks_header(root / "include/hooks.hpp")
              patch_hooks_source(root / "src/hooks.cpp")
              patch_outer_header(root / "include/context.hpp")
              patch_outer_source(root / "src/context.cpp")
          '''
          new = '''    patch_hooks_header(root / "include/hooks.hpp")
              patch_hooks_source(root / "src/hooks.cpp")
          '''
          if old not in text:
              raise SystemExit('apply-adreno-evidence-profile.py: runtime outer-profile anchor missing')
          text = text.replace(old, new, 1)
          old_profile = '''def apply_profiling(root: Path) -> None:
              """Apply heavy generated-stage timestamp instrumentation for diagnostics."""
              patch_timestamp_query_pool(
          '''
          new_profile = '''def apply_profiling(root: Path) -> None:
              """Apply opt-in runtime/GPU instrumentation for diagnostics."""
              patch_outer_header(root / "include/context.hpp")
              patch_outer_source(root / "src/context.cpp")
              patch_timestamp_query_pool(
          '''
          if old_profile not in text:
              raise SystemExit('apply-adreno-evidence-profile.py: profiling function anchor missing')
          text = text.replace(old_profile, new_profile, 1)
          evidence.write_text(text, encoding='utf-8')

          residency = Path('scripts/adreno_android_runtime_residency.py')
          text = residency.read_text(encoding='utf-8')
          old = '''    new_delete = """    contexts.erase(it);\\n#ifndef __ANDROID__\\n    if (contexts.empty())\\n        resetRuntime();\\n#else\\n    // Android swapchain/context churn must not unload the private Vulkan runtime\\n    // from deleteContext() while runtimeMutex is held. Reconfiguration and the\\n    // explicit finalize() path remain the only runtime destruction boundaries.\\n    if (contexts.empty())\\n        std::cerr << \\\"lsfg-vk: framegen runtime retained after last Android context\\\\n\\\";\\n#endif\\n}\\n"""
          '''
          new = '''    new_delete = """    contexts.erase(it);\\n#ifndef __ANDROID__\\n    if (contexts.empty())\\n        resetRuntime();\\n#else\\n    // Android swapchain/context churn must not unload the private Vulkan runtime\\n    // from deleteContext() while runtimeMutex is held. Reconfiguration and the\\n    // explicit finalize() path remain the only runtime destruction boundaries.\\n#endif\\n}\\n"""
          '''
          if old not in text:
              raise SystemExit('runtime residency debug-log anchor missing')
          residency.write_text(text.replace(old, new, 1), encoding='utf-8')

          layer = Path('src/layer_android.cpp')
          text = layer.read_text(encoding='utf-8')
          text = text.replace('#include <atomic>\n', '', 1)
          text, n = re.subn(
              r'\nvoid logPresentationHookResolution\(const char\* resolver, const std::string& name\) \{.*?\n\}\n',
              '\n', text, count=1, flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'layer_android.cpp: hook-resolution logger removal count={n}')
          for snippet in [
              '        std::cerr << "lsfg-vk: runtime stage=private-framegen-instance-destroy-pass-through\\n";\n',
              '            std::cerr << "lsfg-vk: runtime stage=private-framegen-instance-pass-through\\n";\n',
              '        std::cerr << "lsfg-vk: Vulkan instance layer initialized successfully.\\n";\n',
              '                std::cerr << "lsfg-vk: Vulkan device has no VK_KHR_swapchain; passing through without frame generation.\\n";\n',
              '        std::cerr << "lsfg-vk: runtime stage=device-dispatch-ready presentation=1\\n";\n',
              '        std::cerr << "lsfg-vk: Vulkan device layer initialized successfully.\\n";\n',
              '        logPresentationHookResolution("gipa", name);\n',
              '        logPresentationHookResolution("gdpa", name);\n',
          ]:
              if snippet not in text:
                  raise SystemExit(f'layer_android.cpp: expected diagnostic snippet missing: {snippet!r}')
              text = text.replace(snippet, '', 1)
          text, n = re.subn(
              r'            std::cerr << "lsfg-vk: runtime stage=gdpa-untracked-wsi-hook-resolved name="\n\s*<< name << "\\n";\n',
              '', text, count=1,
          )
          if n != 1:
              raise SystemExit(f'layer_android.cpp: untracked WSI trace removal count={n}')
          layer.write_text(text, encoding='utf-8')

          device = Path('framegen/src/core/device.cpp')
          text = device.read_text(encoding='utf-8')
          for inc in ['#include <iomanip>\n', '#include <sstream>\n']:
              if inc not in text:
                  raise SystemExit(f'device.cpp: missing include {inc.strip()}')
              text = text.replace(inc, '', 1)
          text, n = re.subn(
              r'\nstd::string uuidString\(const std::array<uint8_t, VK_UUID_SIZE>& uuid\) \{.*?\n\}\n',
              '\n', text, count=1, flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'device.cpp: uuid formatter removal count={n}')
          verbose = re.compile(
              r'    std::cerr << "lsfg-vk: backend-init apiVersion=".*?<< shaderPrecisionName\(decision\.shaderPrecision\) << \'\\n\';\n',
              re.S,
          )
          replacement = '''    std::cerr << "lsfg-vk: backend driver=\\\"" << this->diagnostics.driverName
                        << "\\\" ahb_mode=" << LSFG::ahbTransportModeName(this->diagnostics.ahbTransportMode)
                        << " sync=" << synchronizationPathName(decision.synchronizationPath) << '\\n';
          '''
          text, n = verbose.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'device.cpp: verbose backend log replacement count={n}')
          device.write_text(text, encoding='utf-8')

          b14 = Path('scripts/apply-candidate-b14-mipmaps-tail-fusion.py')
          text = b14.read_text(encoding='utf-8')
          text, n = re.subn(
              r'        std::cerr << "lsfg-vk: init stage=b14-mipmaps-capability".*?                  << \'\\n\';\n',
              '''        std::cerr << "lsfg-vk: b14-mipmaps capability="
                            << (mipmapsSubgroupBroadcastSupported ? "enabled" : "fallback-b13")
                            << " query=" << b14::subgroupQueryRouteName(subgroupQuery.route)
                            << '\\n';
          ''', text, count=1, flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'B14 capability log simplification count={n}')
          text, n = re.subn(
              r'                std::cerr << "lsfg-vk: candidate-b14-mipmaps-tail-fusion"\n                          << " applied=".*?                          << std::endl;\n',
              '''                std::cerr << "lsfg-vk: candidate-b14-mipmaps-tail-fusion"
                              << " applied=" << (b14Report.applied ? 1 : 0)
                              << " capability_gate=1 fallback=none"
                              << std::endl;
          ''', text, count=1, flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'B14 rewrite log simplification count={n}')
          b14.write_text(text, encoding='utf-8')

          context = Path('src/context.cpp')
          text = context.read_text(encoding='utf-8')
          text, n = re.subn(
              r'        // print config\n        std::cerr << "lsfg-vk: Reloaded configuration for " << name\.second << ":\\n";.*?        if \(conf\.e_present != 2\) std::cerr << "  ! Present Mode: " << conf\.e_present << \'\\n\';\n',
              '''        std::cerr << "lsfg-vk: configuration reloaded target=" << name.second
                            << " multiplier=" << conf.multiplier
                            << " adaptive=" << (conf.adaptiveFramegen ? 1 : 0)
                            << " target_fps=" << conf.fpsLimit << '\\n';
          ''', text, count=1, flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'context.cpp: config log simplification count={n}')
          context.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/b14-promotion-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"\n', '', 1)
          text = text.replace('          LSFGVK_MIPMAPS_CANDIDATE_SCRIPT: scripts/apply-candidate-b14-mipmaps-tail-fusion.py\n', '', 1)
          needle = "            'candidate-fp16-motion-compaction'; do\n"
          repl = "            'candidate-fp16-motion-compaction' \\\n            'b12-stage-profile' \\\n            'mipmaps_avg_ms=' \\\n            'beta4_avg_ms='; do\n"
          if needle not in text:
              raise SystemExit('promotion workflow: forbidden-marker anchor missing')
          text = text.replace(needle, repl, 1)
          workflow.write_text(text, encoding='utf-8')

          # Production invariants: diagnostic modes remain opt-in and unpromoted candidates stay excluded.
          build_text = build.read_text(encoding='utf-8')
          assert 'B12_DUAL_STAGE_PROFILE="${LSFGVK_B12_DUAL_STAGE_PROFILE:-0}"' in build_text
          assert 'MIPMAPS_CANDIDATE_SCRIPT="${LSFGVK_MIPMAPS_CANDIDATE_SCRIPT:-scripts/apply-candidate-b14-mipmaps-tail-fusion.py}"' in build_text
          assert 'ADAPTIVE_RUNTIME="${LSFGVK_ADAPTIVE_RUNTIME:-1}"' in build_text
          assert 'requires LSFGVK_B12_DUAL_STAGE_PROFILE=1' not in build_text
          PY

          git diff --check

      - name: Run host regression tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude src/adaptive_scheduler.cpp tests/adaptive_scheduler_test.cpp -o /tmp/lsfg-adaptive-scheduler-test
          /tmp/lsfg-adaptive-scheduler-test
          python3 tests/android_adaptive_history_test.py
          python3 tests/android_ahb_portability_test.py
          python3 tests/android_deferred_zero_history_test.py
          python3 tests/android_capability_architecture_test.py
          python3 tests/android_candidate_b14_mipmaps_tail_fusion_test.py
          python3 tests/android_b15_subgroup_gate_test.py

      - name: Commit production cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No cleanup diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build/android.sh \
            scripts/apply-adreno-evidence-profile.py \
            scripts/adreno_android_runtime_residency.py \
            scripts/apply-candidate-b14-mipmaps-tail-fusion.py \
            src/layer_android.cpp src/context.cpp framegen/src/core/device.cpp \
            .github/workflows/b14-promotion-validation.yml
          git commit -m 'cleanup(android): strip production profiling and debug traces'
          git push origin HEAD:${GITHUB_REF_NAME}
