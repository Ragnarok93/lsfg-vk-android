name: Probe removed runtime diagnostics references

on:
  push:
    branches:
      - feature/adreno-6xx-b14-directional-ahb-adaptive-reload

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Locate generators and transformed references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SOURCE GENERATORS ==='
          grep -RFn --include='*.py' -e 'windowHandoffHostWaitMs' -e 'diagnosticStage_' -e 'lastDiagnosticStage' -e 'target_fps=' scripts tests || true
          echo '=== PRISTINE SOURCE ==='
          grep -RFn -e 'windowHandoffHostWaitMs' -e 'diagnosticStage_' -e 'lastDiagnosticStage' -e 'target_fps=' src include || true
          tmp="$(mktemp -d)"
          tar --exclude=.git -cf - . | tar -xf - -C "$tmp"
          python3 "$tmp/scripts/apply-adreno-evidence-profile.py" --root "$tmp" --runtime-only
          echo '=== TRANSFORMED SOURCE ==='
          grep -RFn -e 'windowHandoffHostWaitMs' -e 'diagnosticStage_' -e 'lastDiagnosticStage' -e 'target_fps=' "$tmp/src" "$tmp/include" || true
          echo '=== CONTEXT NEIGHBORHOODS ==='
          python3 - "$tmp" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          for rel in ('src/context.cpp','src/hooks.cpp'):
              text=(root/rel).read_text(encoding='utf-8')
              print(f'--- {rel} ---')
              for needle in ('windowHandoffHostWaitMs','diagnosticStage_','lastDiagnosticStage','target_fps='):
                  start=0
                  while True:
                      p=text.find(needle,start)
                      if p<0: break
                      print(text[max(0,p-350):p+500])
                      start=p+len(needle)
          PY
