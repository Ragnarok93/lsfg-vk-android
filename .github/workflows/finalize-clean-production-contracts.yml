name: Finalize clean production contracts

on:
  push:
    branches:
      - feature/adreno-6xx-b14-directional-ahb-adaptive-reload

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update clean-production contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Make the default adaptive runtime variable authoritative throughout the build.
          p = Path('scripts/build/android.sh')
          text = p.read_text(encoding='utf-8')
          old = 'if [[ "${LSFGVK_ADAPTIVE_RUNTIME:-0}" == "1" ]]; then'
          count = text.count(old)
          if count < 1:
              raise SystemExit('no raw adaptive-runtime conditional found')
          text = text.replace(old, 'if [[ "${ADAPTIVE_RUNTIME}" == "1" ]]; then')
          p.write_text(text, encoding='utf-8')

          # Adapt the opt-in capability diagnostic transform to the concise production log.
          p = Path('scripts/adreno_evidence_capabilities.py')
          text = p.read_text(encoding='utf-8')
          label = '        label=f"{path}: capability log",\n    )\n'
          end = text.index(label) + len(label)
          start = text.rfind('    text = replace_exact(\n', 0, end)
          if start < 0:
              raise SystemExit('capability log transform start not found')
          replacement = '''    text = replace_exact(
              text,
              "              << \\\" sync=\\\" << synchronizationPathName(decision.synchronizationPath) << '\\\\n';\\n",
              "              << \\\" externalSemaphoreOpaqueFd=\\\"\\n"
              "              << (this->diagnostics.externalSemaphoreOpaqueFd ? 1 : 0)\\n"
              "              << \\\" externalSemaphoreSyncFd=\\\"\\n"
              "              << (this->diagnostics.externalSemaphoreSyncFd ? 1 : 0)\\n"
              "              << \\\" subgroupSize=\\\" << subgroup.subgroupSize\\n"
              "              << \\\" subgroupStages=\\\" << subgroup.supportedStages\\n"
              "              << \\\" subgroupOperations=\\\" << subgroup.supportedOperations\\n"
              "              << \\\" sync=\\\" << synchronizationPathName(decision.synchronizationPath) << '\\\\n';\\n",
              count=1,
              label=f"{path}: capability log",
          )
          '''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # Stop treating removed debug breadcrumbs as the WSI correctness contract.
          p = Path('tests/android_wsi_loader_bridge_test.py')
          text = p.read_text(encoding='utf-8')
          old = '''    def test_production_dispatch_path_retains_wsi_resolution_breadcrumbs(self) -> None:
                  layer = (ROOT / "src/layer_android.cpp").read_text(encoding="utf-8")
                  for token in (
                      'logPresentationHookResolution("gipa", name)',
                      'logPresentationHookResolution("gdpa", name)',
                      '"vkCreateSwapchainKHR"',
                      '"vkQueuePresentKHR"',
                      '"-hook-resolved name="',
                  ):
                      self.assertIn(token, layer)
          
                  hooks = (ROOT / "src/hooks.cpp").read_text(encoding="utf-8")
                  self.assertIn("init stage=swapchain-hook-enter", hooks)
          
                  context = (ROOT / "src/context.cpp").read_text(encoding="utf-8")
                  self.assertIn("runtime stage=first-present-enter", context)
                  self.assertIn("runtime stage=first-present-cycle-ready", context)
          '''
          new = '''    def test_production_dispatch_path_retains_wsi_resolution_logic(self) -> None:
                  layer = (ROOT / "src/layer_android.cpp").read_text(encoding="utf-8")
                  for token in (
                      '"vkCreateSwapchainKHR"',
                      '"vkQueuePresentKHR"',
                      'isDeviceWsiHook(name)',
                      'downstream(device, pName)',
                      'return it->second;',
                  ):
                      self.assertIn(token, layer)
          
                  # Development breadcrumbs are intentionally absent from production.
                  self.assertNotIn('logPresentationHookResolution(', layer)
                  self.assertNotIn('runtime stage=gdpa-untracked-wsi-hook-resolved', layer)
          '''
          if text.count(old) != 1:
              raise SystemExit('WSI breadcrumb test block not found')
          text = text.replace(old, new, 1)
          text = text.replace('            "runtime stage=device-dispatch-ready presentation=1",\n', '', 1)
          text = text.replace('            "runtime stage=gdpa-untracked-wsi-hook-resolved name=",\n', '            "if (!downstream || !downstream(device, pName))",\n            "return it->second;",\n', 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Run focused and portability regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/android_wsi_loader_bridge_test.py
          python3 tests/android_ahb_portability_test.py
          python3 tests/android_external_semaphore_regression_test.py
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_adaptive_history_test.py
          python3 tests/android_deferred_zero_history_test.py
          python3 tests/android_adreno_evidence_bundle_test.py
          python3 tests/android_capability_architecture_test.py
          python3 tests/android_candidate_b14_mipmaps_tail_fusion_test.py
          python3 -m py_compile scripts/adreno_evidence_capabilities.py
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude src/adaptive_scheduler.cpp tests/adaptive_scheduler_test.cpp -o /tmp/adaptive-test
          /tmp/adaptive-test
      - name: Commit final contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build/android.sh scripts/adreno_evidence_capabilities.py tests/android_wsi_loader_bridge_test.py
          git commit -m 'fix(android): align clean production contracts'
          git push origin HEAD:${GITHUB_REF_NAME}
