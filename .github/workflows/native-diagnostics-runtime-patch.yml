name: Apply native diagnostics runtime timeline patch

on:
  push:
    branches:
      - Adaptive-Frame-Generation
    paths:
      - .github/native-diagnostics-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0

      - name: Patch background runtime diagnostics timeline
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('src/hooks.cpp')
          text = path.read_text()
          insert = base64.b64decode('').decode()
          marker = base64.b64decode('ICAgIHZvaWQgcnVudGltZUlvV29ya2VyKCkgewo=').decode()
          old = base64.b64decode('ICAgICAgICAgICAgaWYgKHN0YXRzU25hcHNob3QuaGFzX3ZhbHVlKCkpCiAgICAgICAgICAgICAgICB3cml0ZVJ1bnRpbWVTdGF0c1NuYXBzaG90Tm93KCpzdGF0c1NuYXBzaG90KTsK').decode()
          new = base64.b64decode('ICAgICAgICAgICAgaWYgKHN0YXRzU25hcHNob3QuaGFzX3ZhbHVlKCkpIHsKICAgICAgICAgICAgICAgIHdyaXRlUnVudGltZVN0YXRzU25hcHNob3ROb3coKnN0YXRzU25hcHNob3QpOwogICAgICAgICAgICAgICAgd3JpdGVSdW50aW1lRGlhZ25vc3RpY1RpbWVsaW5lTm93KCpzdGF0c1NuYXBzaG90KTsKICAgICAgICAgICAgfQo=').decode()
          assert text.count(marker) == 1, text.count(marker)
          assert text.count(old) == 1, text.count(old)
          text = text.replace(marker, insert + marker, 1)
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/hooks.cpp
          git diff --cached --check
          git commit -m "feat(android): persist runtime diagnostics timeline"
          git push origin HEAD:Adaptive-Frame-Generation
