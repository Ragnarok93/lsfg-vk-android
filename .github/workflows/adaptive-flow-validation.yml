name: Adaptive Flow controller validation

on:
  push:
    branches:
      - "feature/adaptive-flow-scale-*"
  workflow_dispatch:

concurrency:
  group: adaptive-flow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    name: Adaptive Flow controller tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build and run controller tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iinclude \
            src/adaptive_flow_controller.cpp \
            tests/adaptive_flow_controller_test.cpp \
            -o /tmp/lsfg-adaptive-flow-controller-test
          /tmp/lsfg-adaptive-flow-controller-test
