name: Fix final cleanup guard

on:
  push:
    branches:
      - feature/adreno-6xx-b14-directional-ahb-adaptive-reload

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Correct cleanup postcondition and re-arm one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/final-production-cleanup.yml')
          text = p.read_text(encoding='utf-8')
          old_guard = "    if: github.actor != 'github-actions[bot]'\n"
          new_guard = "    if: github.event.head_commit.message != 'cleanup(android): strip production profiling and debug traces'\n"
          if text.count(old_guard) != 1:
              raise SystemExit('cleanup actor guard anchor missing')
          text = text.replace(old_guard, new_guard, 1)
          old_assert = "          assert 'requires LSFGVK_B12_DUAL_STAGE_PROFILE=1' not in build_text\n"
          new_assert = "          assert 'LSFGVK_MIPMAPS_CANDIDATE_SCRIPT requires LSFGVK_B12_DUAL_STAGE_PROFILE=1' not in build_text\n"
          if text.count(old_assert) != 1:
              raise SystemExit('cleanup postcondition anchor missing')
          p.write_text(text.replace(old_assert, new_assert, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-final-production-cleanup-guard.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/final-production-cleanup.yml
          git commit -m 'ci: correct final production cleanup guard'
          git push origin HEAD:${GITHUB_REF_NAME}
