name: Verify WSI coalescing regression

on:
  push:
    branches: [Adaptive-Frame-Generation]
    paths:
      - '.github/workflows/verify-wsi-red.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run WSI transition regression test
        run: python3 tests/android_wsi_transition_coalescing_test.py
