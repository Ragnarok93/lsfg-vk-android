name: Bannerlator engine policy regression

on:
  push:
    branches:
      - "feature/bannerlator-engine-improvements-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile production policy helpers and Adaptive Flow controller
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -O2
          -I include
          tests/bannerlator_engine_policy_test.cpp
          src/adaptive_flow_controller.cpp
          -o /tmp/bannerlator-engine-policy-test

      - name: Run policy regression and churn tests
        run: /tmp/bannerlator-engine-policy-test
