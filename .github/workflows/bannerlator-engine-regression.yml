name: Bannerlator engine policy regression

on:
  push:
    branches:
      - "feature/bannerlator-engine-improvements-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile production policy helpers and Adaptive Flow controller
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -O2
          -I include
          tests/bannerlator_engine_policy_test.cpp
          src/adaptive_flow_controller.cpp
          -o /tmp/bannerlator-engine-policy-test

      - name: Run policy regression and churn tests
        run: /tmp/bannerlator-engine-policy-test

      - name: Compile and run full Adaptive Flow controller tests
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -O2
          -I include
          tests/adaptive_flow_controller_test.cpp
          src/adaptive_flow_controller.cpp
          -o /tmp/adaptive-flow-controller-test
          && /tmp/adaptive-flow-controller-test

      - name: Compile and run Adaptive FG scheduler tests
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -O2
          -I include
          tests/adaptive_scheduler_test.cpp
          src/adaptive_scheduler.cpp
          -o /tmp/adaptive-scheduler-test
          && /tmp/adaptive-scheduler-test

      - name: Validate Adaptive Flow seeded handoff contract
        run: python3 tests/android_adaptive_flow_shadow_transition_test.py

      - name: Validate Adaptive Flow runtime pressure telemetry
        run: python3 tests/adaptive_flow_runtime_pressure_test.py

      - name: Validate Android runtime stability contracts
        run: python3 tests/android_runtime_stability_test.py
