name: Apply task 1 capability refactor

on:
  push:
    branches:
      - refactor/capability-driven-framegen-20260831

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap task1 capability refactor')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-driver capability refactor
        run: python3 scripts/apply_task1_capability_refactor.py
      - name: Commit generated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(vulkan): bind framegen to exact driver identity"
          git push origin HEAD:${GITHUB_REF_NAME}
