name: Capture Task 1 NDK compiler errors

on:
  push:
    branches:
      - refactor/capability-driven-framegen-20260831

permissions:
  contents: write

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'diagnostic: capture task1 NDK compiler errors')
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.3.13750724
      ANDROID_PLATFORM: android-28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: android-actions/setup-android@v3
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Capture arm64 build diagnostics
        shell: bash
        run: |
          set +e
          ANDROID_ABI=arm64-v8a HOST_TAG=linux-x86_64 bash ./scripts/build/android.sh Release > /tmp/task1-build.log 2>&1
          status=$?
          mkdir -p diagnostics
          {
            echo "exit_status=$status"
            grep -nE -C3 'error:|fatal error:|FAILED:|CMake Error|undefined reference|ninja: build stopped' /tmp/task1-build.log || true
          } > diagnostics/task1-arm64-errors.txt
          tail -n 200 /tmp/task1-build.log >> diagnostics/task1-arm64-errors.txt
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/task1-arm64-errors.txt
          git commit -m "chore: record task1 compiler diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
