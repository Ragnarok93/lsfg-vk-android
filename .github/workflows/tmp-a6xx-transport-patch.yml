            { VK_ANDROID_EXTERNAL_MEMORY_ANDROID_HARDWARE_BUFFER_EXTENSION_NAME }
        );
''',
              '''        std::vector<const char*> requiredExtensions{
            VK_ANDROID_EXTERNAL_MEMORY_ANDROID_HARDWARE_BUFFER_EXTENSION_NAME,
        };
        if (supportsOpaqueFdExternalSemaphore(physicalDevice))
