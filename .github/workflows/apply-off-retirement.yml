name: Apply strict OFF transition patch

on:
  push:
    branches:
      - Adaptive-Frame-Generation
    paths:
      - .github/workflows/apply-off-retirement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Adaptive branch
        uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0

      - name: Apply reviewed patch
        run: python3 scripts/apply_off_transition_patch.py

      - name: Verify focused native contracts
        run: |
          git diff --check
          python3 tests/android_off_path_contract_test.py
          python3 tests/android_present_metadata_contract_test.py
          python3 tests/android_source_pacing_test.py

      - name: Commit patch and remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hooks.cpp
          git rm .github/workflows/apply-off-retirement.yml scripts/apply_off_transition_patch.py
          git diff --cached --check
          git commit -m 'fix(android): retire LSFG state immediately on disable'
          git push origin HEAD:Adaptive-Frame-Generation
