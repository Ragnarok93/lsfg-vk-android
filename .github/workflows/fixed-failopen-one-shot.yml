name: Fixed LSFG fail-open recovery

'on':
  push:
    branches: [fix/fixed-runtime-failopen-20260904]
    paths: [.github/workflows/fixed-failopen-one-shot.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/fixed-runtime-failopen-20260904
          fetch-depth: 0
      - name: Patch fixed-mode swapchain fail-open
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/hooks.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''            return VK_SUCCESS;\n        }\n        return VK_SUCCESS;\n    }\n\n    VkResult myvkQueuePresentKHR'''
          new = '''            const VkSwapchainKHR failedSwapchain = *pSwapchain;\n            eraseSwapchainState(failedSwapchain);\n            Layer::ovkDestroySwapchainKHR(device, failedSwapchain, pAllocator);\n            *pSwapchain = VK_NULL_HANDLE;\n\n            const auto fallbackRes = Layer::ovkCreateSwapchainKHR(\n                device, pCreateInfo, pAllocator, pSwapchain);\n            if (fallbackRes == VK_SUCCESS) {\n                swapchainToDeviceTable.emplace(*pSwapchain, device);\n                std::cerr << "lsfg-vk: init stage=swapchain-fallback-pass-through"\n                             " reason=ls-context-failed\\n";\n                return VK_SUCCESS;\n            }\n            std::cerr << "lsfg-vk: init stage=swapchain-fallback-failed result="\n                      << fallbackRes << "\\n";\n            return fallbackRes;\n        }\n        return VK_SUCCESS;\n    }\n\n    VkResult myvkQueuePresentKHR'''
          if old not in text:
              raise SystemExit('expected fixed-mode catch block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          python3 tests/android_fixed_mode_failopen_test.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hooks.cpp
          git commit -m 'fix(android): recreate original swapchain when LSFG setup fails'
          git push origin HEAD:fix/fixed-runtime-failopen-20260904
