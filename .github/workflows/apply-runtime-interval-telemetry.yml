name: Apply runtime interval telemetry

on:
  push:
    branches:
      - Adaptive-Frame-Generation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'run native interval telemetry patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0

      - name: Apply interval telemetry source changes
        run: python3 .github/scripts/apply_runtime_interval_telemetry.py

      - name: Run focused native contracts
        run: |
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_hot_reload_capability_cache_test.py
          python3 tests/android_ahb_portability_test.py

      - name: Commit interval telemetry
        run: |
          rm .github/workflows/apply-runtime-interval-telemetry.yml
          rm .github/scripts/apply_runtime_interval_telemetry.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(android): export measured generation interval telemetry"
          git push origin HEAD:Adaptive-Frame-Generation
