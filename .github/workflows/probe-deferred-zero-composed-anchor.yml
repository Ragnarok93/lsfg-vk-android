name: Probe deferred-zero composed anchor

on:
  push:
    branches:
      - feature/adreno-6xx-b14-directional-ahb-adaptive-reload

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply pre-Candidate-A runtime transforms and print source neighborhood
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          root = Path.cwd()
          scripts = root / 'scripts'
          sys.path.insert(0, str(scripts))

          spec = importlib.util.spec_from_file_location('evidence_bundle', scripts / 'apply-adreno-evidence-profile.py')
          bundle = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(bundle)

          from adreno_syncfd_handoff import apply as apply_syncfd_handoff
          from adreno_async_zero_history import apply as apply_async_zero_history
          from adreno_async_zero_history_hardening import apply as apply_async_zero_history_hardening
          from adreno_slot_aware_zero_history import apply as apply_slot_aware_zero_history
          from adreno_transport_release_overlap import apply as apply_transport_release_overlap

          bundle.patch_backend_header(root / 'framegen/public/lsfg_backend.hpp')
          bundle.patch_device_source(root / 'framegen/src/core/device.cpp')
          bundle.patch_hooks_header(root / 'include/hooks.hpp')
          bundle.patch_hooks_source(root / 'src/hooks.cpp')
          if 'int exportFd(' not in (root / 'include/mini/semaphore.hpp').read_text(encoding='utf-8'):
              apply_syncfd_handoff(root)
          bundle.normalize_sync_fd_import_initializer(root / 'framegen/src/core/semaphore.cpp')
          apply_async_zero_history(root)
          apply_async_zero_history_hardening(root)
          apply_slot_aware_zero_history(root)
          apply_transport_release_overlap(root)

          text = (root / 'src/context.cpp').read_text(encoding='utf-8')
          for needle in ('pass.preCopyBuf.end();', 'gameRenderSemaphores2', 'previousSourceCopySignalValid_', 'if (adaptiveZeroGeneration)'):
              pos = text.find(needle)
              print(f'=== {needle} @ {pos} ===')
              if pos >= 0:
                  print(text[max(0,pos-1200):pos+1800])
          PY
