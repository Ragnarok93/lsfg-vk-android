name: Adaptive source pacing bootstrap

on:
  push:
    branches:
      - Adaptive-Frame-Generation

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'feat(pacing): integrate source FPS limit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0

      - name: Apply guarded source-pacing integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hooks.cpp')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          if '#include "source_frame_pacer.hpp"' not in source:
              replace_once(
                  '#include "layer.hpp"\n',
                  '#include "layer.hpp"\n#include "source_frame_pacer.hpp"\n',
              )
          if '#include <thread>' not in source:
              replace_once('#include <vector>\n', '#include <vector>\n#include <thread>\n')

          replace_once(
              '        std::vector<VkSemaphore> presentWaitSemaphores;\n',
              '        std::vector<VkSemaphore> presentWaitSemaphores;\n'
              '        SourceFramePacer sourceFramePacer;\n',
          )

          target_line = '                << "target_fps=" << targetFps << \'\\n\'\n'
          source_limit_line = (
              '                << "source_limit_fps=" << Config::activeConf.sourceFpsLimit << \'\\n\'\n'
          )
          count = source.count(target_line)
          if count != 2:
              raise SystemExit(f'expected two target_fps stats lines, found {count}')
          source = source.replace(target_line, target_line + source_limit_line)

          replace_once(
              '                              << " targetFps=" << Config::activeConf.fpsLimit\n',
              '                              << " targetFps=" << Config::activeConf.fpsLimit\n'
              '                              << " sourceFpsLimit=" << Config::activeConf.sourceFpsLimit\n',
          )

          pacing_anchor = '''        if (configuredPresent != conf.e_present) {
            Layer::ovkQueuePresentKHR(queue, pPresentInfo);
            return VK_ERROR_OUT_OF_DATE_KHR;
        }

        try {
'''
          pacing_block = '''        if (configuredPresent != conf.e_present) {
            Layer::ovkQueuePresentKHR(queue, pPresentInfo);
            return VK_ERROR_OUT_OF_DATE_KHR;
        }

#ifdef __ANDROID__
        auto& sourceFramePacer = runtimeStats.sourceFramePacer;
        sourceFramePacer.configure(conf.sourceFpsLimit);
        const auto sourcePacingDelay = sourceFramePacer.delayUntilNext(
            SourceFramePacer::Clock::now());
        if (sourcePacingDelay > std::chrono::nanoseconds::zero())
            std::this_thread::sleep_for(sourcePacingDelay);
#endif

        try {
'''
          replace_once(pacing_anchor, pacing_block)

          path.write_text(source, encoding='utf-8')
          PY

          python3 tests/android_source_pacing_test.py
          git diff --check

      - name: Commit production integration
        shell: bash
        run: |
          git config user.name "Ethan Fontenot"
          git config user.email "e_fontenot1@yahoo.com"
          git add src/hooks.cpp
          git diff --cached --quiet && exit 0
          git commit -m "feat(pacing): integrate source FPS limit"
          git push origin HEAD:Adaptive-Frame-Generation
