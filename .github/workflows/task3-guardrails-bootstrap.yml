name: Apply task 3 deadlock guardrails

on:
  push:
    branches:
      - refactor/capability-driven-framegen-20260831

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap task3 deadlock guardrails')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded wait, swapchain and blit guardrails
        run: python3 scripts/apply_task3_deadlock_guardrails.py
      - name: Run capability architecture contract before push
        run: python3 tests/android_capability_architecture_test.py
      - name: Commit generated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(android): bound waits and fail open on WSI limits"
          git push origin HEAD:${GITHUB_REF_NAME}
