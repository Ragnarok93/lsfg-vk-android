name: Apply fixed governor cleanup

on:
  push:
    branches:
      - experimental/winnative-governor-cleanup-stage

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply fixed-governor cleanup
        run: python3 scripts/apply_fixed_governor_cleanup.py

      - name: Remove unreachable zero-count presentation paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/context.cpp")
          text = path.read_text(encoding="utf-8")
          old = '''    VkSemaphore lastPrevPostCopySemaphore = generatedFrameCount > 0
        ? pass.prevPostCopySemaphores.at(generatedFrameCount - 1).handle()
        : pass.preCopySemaphores.at(0).handle();
    const VkPresentInfoKHR finalPresentInfo{
        .sType = VK_STRUCTURE_TYPE_PRESENT_INFO_KHR,
        .pNext = generatedFrameCount == 0 ? pNext : nullptr,
'''
          new = '''    const VkSemaphore lastPrevPostCopySemaphore =
        pass.prevPostCopySemaphores.at(generatedFrameCount - 1).handle();
    const VkPresentInfoKHR finalPresentInfo{
        .sType = VK_STRUCTURE_TYPE_PRESENT_INFO_KHR,
        .pNext = nullptr,
'''
          if text.count(old) != 1:
              raise SystemExit("expected one final-present zero-count fallback")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run cleanup contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/android_ahb_portability_test.py
          python3 tests/android_wsi_loader_bridge_test.py
          python3 tests/android_wsi_provenance_test.py
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_capability_architecture_test.py
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude \
            src/fixed_frame_governor.cpp tests/fixed_frame_governor_test.cpp \
            -o /tmp/lsfg-fixed-frame-governor-test
          /tmp/lsfg-fixed-frame-governor-test

      - name: Remove one-shot transformer and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_fixed_governor_cleanup.py
          rm -f .github/workflows/apply-fixed-governor-cleanup.yml
          git config user.name "Ragnarok93"
          git config user.email "e_fontenot1@yahoo.com"
          git add -A
          git status --short
          git commit -m "refactor(lsfg): replace abandoned adaptive mode with fixed governor"
          git push origin HEAD:experimental/winnative-governor-cleanup-stage
