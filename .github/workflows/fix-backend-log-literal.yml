name: Repair backend log literal

on:
  push:
    branches:
      - feature/adreno-6xx-b14-directional-ahb-adaptive-reload

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair newline literal and verify source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('framegen/src/core/device.cpp')
          text = p.read_text(encoding='utf-8')
          old = '''              << " sync=" << synchronizationPathName(decision.synchronizationPath) << '
          ';
          '''
          new = '''              << " sync=" << synchronizationPathName(decision.synchronizationPath) << '\\n';
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed backend log literal, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          g++ -std=c++20 -Wall -Wextra -Werror -Iinclude src/adaptive_scheduler.cpp tests/adaptive_scheduler_test.cpp -o /tmp/adaptive-test
          /tmp/adaptive-test
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add framegen/src/core/device.cpp
          git commit -m 'fix(android): repair concise backend log literal'
          git push origin HEAD:${GITHUB_REF_NAME}
