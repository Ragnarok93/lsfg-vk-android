name: Build Android Bionic layer

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: android-bionic-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.3.13750724
  ANDROID_PLATFORM: android-28

jobs:
  capability-policy:
    name: Capability policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Android portability contract tests
        run: |
          python3 tests/android_ahb_portability_test.py
          python3 tests/android_wsi_loader_bridge_test.py
          python3 tests/android_wsi_provenance_test.py
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_adaptive_history_test.py
          python3 tests/android_capability_architecture_test.py

      - name: Install Vulkan headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libvulkan-dev

      - name: Build and run capability policy tests
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iframegen/include \
            framegen/src/core/capabilities.cpp \
            framegen/tests/capabilities_test.cpp \
            -o /tmp/lsfg-capabilities-test
          /tmp/lsfg-capabilities-test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iinclude \
            src/adaptive_scheduler.cpp \
            tests/adaptive_scheduler_test.cpp \
            -o /tmp/lsfg-adaptive-scheduler-test
          /tmp/lsfg-adaptive-scheduler-test

  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Configure and build Android layer
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          cmake -S . -B "build-android-${ABI}" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DLSFGVK_ANDROID_WINE=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "build-android-${ABI}" --parallel 2

      - name: Package layer artifact
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mkdir -p "artifact-${ABI}"
          cp "build-android-${ABI}/liblsfg-vk.so" "artifact-${ABI}/"
          cp VkLayer_LS_frame_generation.json "artifact-${ABI}/"

      - name: Upload layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-vk-android-${{ matrix.abi }}
          path: artifact-${{ matrix.abi }}
          if-no-files-found: error
