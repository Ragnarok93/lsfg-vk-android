name: Build Android Bionic layer

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: android-bionic-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.3.13750724
  ANDROID_PLATFORM: android-28

jobs:
  capability-policy:
    name: Capability policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libvulkan-dev spirv-tools

      - name: Run Android portability contract tests
        run: |
          python3 tests/android_ahb_portability_test.py
          python3 tests/android_external_semaphore_regression_test.py
          python3 tests/android_wsi_loader_bridge_test.py
          python3 tests/android_instance_dispatch_regression_test.py
          python3 tests/android_wsi_provenance_test.py
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_suspend_timeout_guard_test.py
          python3 tests/android_adaptive_history_test.py
          python3 tests/android_deferred_zero_history_test.py
          python3 tests/android_batch_optimization_test.py
          python3 tests/android_zero_stage_profile_test.py
          python3 tests/android_mipmaps_shader_profile_test.py
          python3 tests/android_candidate_b_shader_hot_path_test.py
          python3 tests/android_candidate_b2_mipmaps_dependency_test.py
          python3 tests/android_candidate_b3_beta4_analysis_test.py
          python3 tests/android_candidate_b4_beta4_predicate_test.py
          python3 tests/android_candidate_b13_beta4_fused_mask_test.py
          python3 tests/android_candidate_b14_mipmaps_tail_fusion_test.py
          python3 tests/android_beta4_evidence_analyzer_test.py
          python3 tests/android_candidate_b9_beta4_spill_collapse_test.py
          python3 tests/android_candidate_b6_pipeline_executable_profile_test.py
          python3 tests/android_candidate_b8_mipmaps_matrix_test.py
          python3 tests/android_final_nonadaptive_sweep_test.py
          python3 tests/android_final_cpu_overhead_test.py
          python3 tests/android_adreno_evidence_bundle_test.py
          python3 tests/android_clean_benchmark_mode_test.py
          python3 tests/android_adreno_evidence_timestamp_stage_test.py
          python3 tests/android_capability_architecture_test.py
          python3 tests/android_b12_timestamp_fallback_test.py
          python3 tests/android_mipmaps_evidence_analyzer_test.py
          python3 tests/android_mipmaps_device_agnostic_evidence_test.py
          python3 scripts/analyze-mipmaps-evidence.py --help >/dev/null
          python3 scripts/analyze-beta4-evidence.py --help >/dev/null

      - name: Build and run capability policy tests
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iframegen/include \
            framegen/src/core/capabilities.cpp \
            framegen/tests/capabilities_test.cpp \
            -o /tmp/lsfg-capabilities-test
          /tmp/lsfg-capabilities-test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iinclude \
            src/adaptive_scheduler.cpp \
            tests/adaptive_scheduler_test.cpp \
            -o /tmp/lsfg-adaptive-scheduler-test
          /tmp/lsfg-adaptive-scheduler-test

  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file binutils
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build clean adaptive runtime for ${{ matrix.abi }}
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          HOST_TAG: linux-x86_64
          LSFGVK_ADAPTIVE_RUNTIME: "1"
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/build/android.sh Release 2>&1 | tee "android-build-${ANDROID_ABI}.log"

      - name: Upload ${{ matrix.abi }} build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ matrix.abi }}
          path: android-build-${{ matrix.abi }}.log
          if-no-files-found: warn

      - name: Inspect clean ${{ matrix.abi }} artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="build-android-${{ matrix.abi }}/dist/liblsfg-vk-${{ matrix.abi }}.so"
          file "$artifact"
          "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h -d "$artifact"

          strings "$artifact" > /tmp/lsfg-strings.txt
          for required in \
            'deferred-zero reprime-warmup-begin' \
            'deferred-zero reprime-deferred request_count=' \
            'candidate-b4-beta4-predicate-opt' \
            'candidate-b11-beta4-pow2-mask' \
            'candidate-b13-beta4-fused-mask' \
            'candidate-b14-mipmaps-tail-fusion'; do
            if ! grep -Fq "$required" /tmp/lsfg-strings.txt; then
              echo "ERROR: clean production artifact is missing required marker: $required" >&2
              exit 1
            fi
          done

          for forbidden in \
            'pipeline-exec-ir-line' \
            'generated-stage-profile backend=' \
            'zero-stage-profile backend=' \
            'final-nonadaptive-sweep' \
            'b12-stage-profile' \
            'b12-timestamp-fallback' \
            'b12-device-profile' \
            'b12-readback-failure' \
            'b12-query-pool-' \
            'mipmaps_attempts=' \
            'beta4_attempts=' \
            'candidate-b15-mip4-topology' \
            'candidate-b15-mip4-register-fusion' \
            'candidate-fp16-motion-compaction'; do
            if grep -Fq "$forbidden" /tmp/lsfg-strings.txt; then
              echo "ERROR: clean production artifact contains forbidden profiling/experimental marker: $forbidden" >&2
              exit 1
            fi
          done

      - name: Upload ${{ matrix.abi }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblsfg-vk-${{ matrix.abi }}
          path: build-android-${{ matrix.abi }}/dist/liblsfg-vk-${{ matrix.abi }}.so
          if-no-files-found: error

  b12-evidence-build:
    name: Build B12 adaptive evidence arm64-v8a
    if: github.ref == 'refs/heads/feature/adreno-6xx-candidate-b11-beta4-pow2-mask'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file binutils
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build adaptive B12 dual-stage evidence runtime
        env:
          ANDROID_ABI: arm64-v8a
          HOST_TAG: linux-x86_64
          LSFGVK_ADAPTIVE_RUNTIME: "1"
          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/build/android.sh Release 2>&1 | tee android-build-b12-arm64-v8a.log

      - name: Inspect B12 evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so"
          file "$artifact"
          strings "$artifact" > /tmp/lsfg-b12-strings.txt
          for required in \
            'candidate-b4-beta4-predicate-opt' \
            'candidate-b11-beta4-pow2-mask' \
            'candidate-b13-beta4-fused-mask' \
            'b12-stage-profile' \
            'b12-stage-profile-init' \
            'b12-stage-profile status=unavailable' \
            'mipmaps_avg_ms=' \
            'beta4_avg_ms=' \
            'mipmaps_attempts=' \
            'mipmaps_failures=' \
            'beta4_attempts=' \
            'beta4_failures=' \
            'b12-readback-failure stage=mipmaps result=' \
            'b12-readback-failure stage=beta4 result=' \
            'b12-query-pool-create-failure' \
            'b12-query-pool-unavailable' \
            'b12-timestamp-capability' \
            'b12-timestamp-fallback' \
            'b12-device-profile'; do
            if ! grep -Fq "$required" /tmp/lsfg-b12-strings.txt; then
              echo "ERROR: B12 evidence artifact is missing fail-visible reporting marker: $required" >&2
              exit 1
            fi
          done
          for forbidden in \
            'pipeline-exec-ir-line' \
            'candidate-b14-mipmaps-tail-fusion' \
            'generated-stage-profile backend=' \
            'zero-stage-profile backend=' \
            'final-nonadaptive-sweep'; do
            if grep -Fq "$forbidden" /tmp/lsfg-b12-strings.txt; then
              echo "ERROR: B12 evidence artifact contains heavyweight profiler marker: $forbidden" >&2
              exit 1
            fi
          done

      - name: Upload B12 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-b12-arm64-v8a
          path: android-build-b12-arm64-v8a.log
          if-no-files-found: warn

      - name: Upload B12 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblsfg-vk-b12-evidence-arm64-v8a
          path: build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so
          if-no-files-found: error

  b12-mipmaps-refinement-build:
    name: Build B14 Mipmaps refinement arm64-v8a
    if: github.ref == 'refs/heads/feature/adreno-6xx-candidate-b11-beta4-pow2-mask'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file binutils
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build B12 Mipmaps refinement runtime
        env:
          ANDROID_ABI: arm64-v8a
          HOST_TAG: linux-x86_64
          LSFGVK_ADAPTIVE_RUNTIME: "1"
          LSFGVK_B12_DUAL_STAGE_PROFILE: "1"
          LSFGVK_MIPMAPS_EXEC_PROFILE: "1"
          LSFGVK_MIPMAPS_CANDIDATE_SCRIPT: scripts/apply-candidate-b14-mipmaps-tail-fusion.py
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/build/android.sh Release 2>&1 | tee android-build-b12-mipmaps-refinement-arm64-v8a.log

      - name: Inspect B12 Mipmaps refinement artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so"
          file "$artifact"
          strings "$artifact" > /tmp/lsfg-b12-mipmaps-refinement-strings.txt
          for required in \
            'candidate-b11-beta4-pow2-mask' \
            'candidate-b13-beta4-fused-mask' \
            'candidate-b14-mipmaps-tail-fusion' \
            'b12-stage-profile' \
            'b12-stage-profile-init' \
            'b12-stage-profile status=unavailable' \
            'mipmaps_avg_ms=' \
            'beta4_avg_ms=' \
            'mipmaps_attempts=' \
            'mipmaps_failures=' \
            'beta4_attempts=' \
            'beta4_failures=' \
            'b12-readback-failure stage=mipmaps result=' \
            'b12-readback-failure stage=beta4 result=' \
            'b12-query-pool-create-failure' \
            'b12-query-pool-unavailable' \
            'b12-timestamp-fallback' \
            'b12-device-profile' \
            'pipeline-exec-profile shader=p_mipmaps' \
            'pipeline-exec-ir-line shader=p_mipmaps'; do
            if ! grep -Fq "$required" /tmp/lsfg-b12-mipmaps-refinement-strings.txt; then
              echo "ERROR: B12 Mipmaps refinement artifact is missing required marker: $required" >&2
              exit 1
            fi
          done
          for forbidden in \
            'generated-stage-profile backend=' \
            'zero-stage-profile backend=' \
            'final-nonadaptive-sweep'; do
            if grep -Fq "$forbidden" /tmp/lsfg-b12-mipmaps-refinement-strings.txt; then
              echo "ERROR: B12 Mipmaps refinement artifact contains unrelated profiler marker: $forbidden" >&2
              exit 1
            fi
          done

      - name: Upload B12 Mipmaps refinement build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-b12-mipmaps-refinement-arm64-v8a
          path: android-build-b12-mipmaps-refinement-arm64-v8a.log
          if-no-files-found: warn

      - name: Upload B12 Mipmaps refinement artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblsfg-vk-b12-mipmaps-refinement-arm64-v8a
          path: build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so
          if-no-files-found: error

  tag_release:
    name: Tag Android release
    needs: [capability-policy, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create next Android release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          existing_tag="$(git tag --points-at "$GITHUB_SHA" -l 'v*-android' | head -n1 || true)"
          if [[ -n "$existing_tag" ]]; then echo "Tag already exists for this commit: $existing_tag"; exit 0; fi
          latest_tag="$(git tag -l 'v*-android' --sort=-v:refname | head -n1 || true)"
          if [[ -n "$latest_tag" ]]; then
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-android$ ]]; then
              major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
              next_tag="v${major}.${minor}.$((patch + 1))-android"
            else
              echo "Unsupported existing Android tag format: $latest_tag" >&2; exit 1
            fi
          else
            base_version="$(grep -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -n1)"
            next_tag="v${base_version}-android"
          fi
          if git rev-parse "$next_tag" >/dev/null 2>&1; then echo "Calculated tag already exists: $next_tag" >&2; exit 1; fi
          git tag -a "$next_tag" -m "Android Bionic release $next_tag"
          git push origin "$next_tag"
