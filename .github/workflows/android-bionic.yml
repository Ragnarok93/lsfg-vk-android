name: Build Android Bionic layer

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-bionic-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.3.13750724
  ANDROID_PLATFORM: android-28

jobs:
  capability-policy:
    name: Capability policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply guarded source-pacing integration
        if: github.event_name == 'push' && github.ref == 'refs/heads/Adaptive-Frame-Generation'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hooks.cpp')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          if '#include "source_frame_pacer.hpp"' not in source:
              replace_once(
                  '#include "layer.hpp"\n',
                  '#include "layer.hpp"\n#include "source_frame_pacer.hpp"\n',
              )
          if '#include <thread>' not in source:
              replace_once('#include <vector>\n', '#include <vector>\n#include <thread>\n')

          if 'SourceFramePacer sourceFramePacer;' not in source:
              replace_once(
                  '        std::vector<VkSemaphore> presentWaitSemaphores;\n',
                  '        std::vector<VkSemaphore> presentWaitSemaphores;\n'
                  '        SourceFramePacer sourceFramePacer;\n',
              )

          if '"source_limit_fps="' not in source:
              target_line = '                << "target_fps=" << targetFps << \'\\n\'\n'
              source_limit_line = (
                  '                << "source_limit_fps=" << Config::activeConf.sourceFpsLimit << \'\\n\'\n'
              )
              count = source.count(target_line)
              if count != 2:
                  raise SystemExit(f'expected two target_fps stats lines, found {count}')
              source = source.replace(target_line, target_line + source_limit_line)

          if '<< " sourceFpsLimit=" << Config::activeConf.sourceFpsLimit' not in source:
              replace_once(
                  '                              << " targetFps=" << Config::activeConf.fpsLimit\n',
                  '                              << " targetFps=" << Config::activeConf.fpsLimit\n'
                  '                              << " sourceFpsLimit=" << Config::activeConf.sourceFpsLimit\n',
              )

          if 'sourceFramePacer.configure(conf.sourceFpsLimit)' not in source:
              pacing_anchor = (
                  '        if (configuredPresent != conf.e_present) {\n'
                  '            Layer::ovkQueuePresentKHR(queue, pPresentInfo);\n'
                  '            return VK_ERROR_OUT_OF_DATE_KHR;\n'
                  '        }\n\n'
                  '        try {\n'
              )
              pacing_block = (
                  '        if (configuredPresent != conf.e_present) {\n'
                  '            Layer::ovkQueuePresentKHR(queue, pPresentInfo);\n'
                  '            return VK_ERROR_OUT_OF_DATE_KHR;\n'
                  '        }\n\n'
                  '#ifdef __ANDROID__\n'
                  '        auto& sourceFramePacer = runtimeStats.sourceFramePacer;\n'
                  '        sourceFramePacer.configure(conf.sourceFpsLimit);\n'
                  '        const auto sourcePacingDelay = sourceFramePacer.delayUntilNext(\n'
                  '            SourceFramePacer::Clock::now());\n'
                  '        if (sourcePacingDelay > std::chrono::nanoseconds::zero())\n'
                  '            std::this_thread::sleep_for(sourcePacingDelay);\n'
                  '#endif\n\n'
                  '        try {\n'
              )
              replace_once(pacing_anchor, pacing_block)

          path.write_text(source, encoding='utf-8')
          PY

          python3 tests/android_source_pacing_test.py
          git diff --check
          git config user.name "Ethan Fontenot"
          git config user.email "e_fontenot1@yahoo.com"
          git add src/hooks.cpp
          git diff --cached --quiet && exit 0
          git commit -m "feat(pacing): integrate source FPS limit"
          git push origin HEAD:Adaptive-Frame-Generation

      - name: Run Android portability contract tests
        run: |
          python3 tests/android_ahb_portability_test.py
          python3 tests/android_wsi_loader_bridge_test.py
          python3 tests/android_wsi_provenance_test.py
          python3 tests/android_runtime_stability_test.py
          python3 tests/android_capability_architecture_test.py
          python3 tests/android_source_pacing_test.py

      - name: Install Vulkan headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libvulkan-dev

      - name: Build and run capability policy tests
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iframegen/include \
            framegen/src/core/capabilities.cpp \
            framegen/tests/capabilities_test.cpp \
            -o /tmp/lsfg-capabilities-test
          /tmp/lsfg-capabilities-test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iinclude \
            src/adaptive_scheduler.cpp \
            tests/adaptive_scheduler_test.cpp \
            -o /tmp/lsfg-adaptive-scheduler-test
          /tmp/lsfg-adaptive-scheduler-test
          g++ -std=c++20 -Wall -Wextra -Werror \
            -Iinclude \
            src/source_frame_pacer.cpp \
            tests/source_frame_pacer_test.cpp \
            -o /tmp/lsfg-source-frame-pacer-test
          /tmp/lsfg-source-frame-pacer-test

  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.abi }}
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          HOST_TAG: linux-x86_64
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/build/android.sh Release 2>&1 | tee "android-build-${ANDROID_ABI}.log"

      - name: Upload ${{ matrix.abi }} build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ matrix.abi }}
          path: android-build-${ANDROID_ABI}.log
          if-no-files-found: warn

      - name: Inspect ${{ matrix.abi }} artifact
        run: |
          file "build-android-${{ matrix.abi }}/dist/liblsfg-vk-${{ matrix.abi }}.so"
          "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h -d "build-android-${{ matrix.abi }}/dist/liblsfg-vk-${{ matrix.abi }}.so"

      - name: Upload ${{ matrix.abi }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblsfg-vk-${{ matrix.abi }}
          path: build-android-${{ matrix.abi }}/dist/liblsfg-vk-${{ matrix.abi }}.so
          if-no-files-found: error

  tag_release:
    name: Tag Android release
    needs: [capability-policy, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create next Android release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          existing_tag="$(git tag --points-at "$GITHUB_SHA" -l 'v*-android' | head -n1 || true)"
          if [[ -n "$existing_tag" ]]; then echo "Tag already exists for this commit: $existing_tag"; exit 0; fi
          latest_tag="$(git tag -l 'v*-android' --sort=-v:refname | head -n1 || true)"
          if [[ -n "$latest_tag" ]]; then
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-android$ ]]; then
              major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
              next_tag="v${major}.${minor}.$((patch + 1))-android"
            else
              echo "Unsupported existing Android tag format: $latest_tag" >&2; exit 1
            fi
          else
            base_version="$(grep -oP 'VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -n1)"
            next_tag="v${base_version}-android"
          fi
          if git rev-parse "$next_tag" >/dev/null 2>&1; then echo "Calculated tag already exists: $next_tag" >&2; exit 1; fi
          git tag -a "$next_tag" -m "Android Bionic release $next_tag"
          git push origin "$next_tag"
