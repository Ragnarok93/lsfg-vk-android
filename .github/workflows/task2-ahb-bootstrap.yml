name: Apply task 2 AHB transport refactor

on:
  push:
    branches:
      - refactor/capability-driven-framegen-20260831

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap task2 AHB transport refactor')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply AHB transport fallback refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_task2_ahb_transport.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('# Fix the advertised-extension regression caught during generated-code review.')
          end = text.index('# Game-side AHB allocator is told whether the external allocation will be bound', start)
          path.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
          python3 scripts/apply_task2_ahb_transport.py
          git checkout -- scripts/apply_task2_ahb_transport.py
      - name: Commit generated source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(android): add capability-selected AHB transport"
          git push origin HEAD:${GITHUB_REF_NAME}
