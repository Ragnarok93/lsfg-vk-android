name: Apply resident LSFG transition fix

on:
  push:
    branches:
      - Adaptive-Frame-Generation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage native resident transition fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0
      - name: Patch resident WSI and explicit pass-through state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          layer_path = Path('src/layer_android.cpp')
          layer = layer_path.read_text()
          anchor = 'namespace {\nPFN_vkCreateInstance next_vkCreateInstance{};'
          replacement = '''namespace {\n\nbool shouldInterceptTarget() {\n    // `targeted` is immutable process residency. Runtime `enable` may change\n    // after the application has cached Vulkan WSI entrypoints, so it must not\n    // decide whether those entrypoints are intercepted.\n    return Config::activeConf.targeted || Config::activeConf.enable;\n}\n\nPFN_vkCreateInstance next_vkCreateInstance{};'''
          if 'bool shouldInterceptTarget()' not in layer:
              if anchor not in layer:
                  raise SystemExit('layer namespace anchor not found')
              layer = layer.replace(anchor, replacement, 1)
          count = layer.count('if (!Config::activeConf.enable) {')
          if count != 2:
              raise SystemExit(f'expected 2 mutable creation gates, found {count}')
          layer = layer.replace('if (!Config::activeConf.enable) {', 'if (!shouldInterceptTarget()) {')
          count = layer.count('Hooks::hooks.end() && Config::activeConf.enable')
          if count != 2:
              raise SystemExit(f'expected 2 mutable WSI resolution gates, found {count}')
          layer = layer.replace(
              'Hooks::hooks.end() && Config::activeConf.enable',
              'Hooks::hooks.end() && shouldInterceptTarget()',
          )
          layer_path.write_text(layer)

          hooks_path = Path('src/hooks.cpp')
          hooks = hooks_path.read_text()

          old_recreate = '''        return previous.dll != next.dll\n            || previous.hdr != next.hdr\n            || previous.multiplier != next.multiplier\n            || previous.e_present != next.e_present;'''
          new_recreate = '''        return previous.dll != next.dll\n            || previous.hdr != next.hdr\n            || previous.multiplier != next.multiplier\n            || previous.performance != next.performance\n            || previous.e_present != next.e_present;'''
          if old_recreate not in hooks:
              raise SystemExit('recreation policy anchor not found')
          hooks = hooks.replace(old_recreate, new_recreate, 1)

          provenance_anchor = '''    std::unordered_map<VkSwapchainKHR, SwapchainWsiProvenance> swapchainWsiProvenance;\n\n#ifdef __ANDROID__'''
          provenance_replacement = '''    std::unordered_map<VkSwapchainKHR, SwapchainWsiProvenance> swapchainWsiProvenance;\n\n    struct PassThroughSwapchainState {\n        std::string reason;\n        bool capabilityBlocked{};\n    };\n    std::unordered_map<VkSwapchainKHR, PassThroughSwapchainState> passThroughSwapchains;\n\n    bool isStructuralCapabilityBlock(const std::string& reason) {\n        return reason == "ahb-unavailable"\n            || reason == "unsupported-usage"\n            || reason == "blit-unsupported";\n    }\n\n#ifdef __ANDROID__'''
          if 'passThroughSwapchains' not in hooks:
              if provenance_anchor not in hooks:
                  raise SystemExit('pass-through map anchor not found')
              hooks = hooks.replace(provenance_anchor, provenance_replacement, 1)

          stats_fields = '''        uint32_t sourceLimitFps{};\n        bool performance{};\n    };'''
          stats_fields_replacement = '''        uint32_t sourceLimitFps{};\n        bool performance{};\n        bool capabilityBlocked{};\n        std::string capabilityReason;\n    };'''
          if stats_fields not in hooks:
              raise SystemExit('runtime stats fields anchor not found')
          hooks = hooks.replace(stats_fields, stats_fields_replacement, 1)

          stats_writer = '''                << "source_limit_fps=" << snapshot.sourceLimitFps << '\\n'\n                << "performance=" << (snapshot.performance ? 1 : 0) << '\\n';'''
          stats_writer_replacement = '''                << "source_limit_fps=" << snapshot.sourceLimitFps << '\\n'\n                << "performance=" << (snapshot.performance ? 1 : 0) << '\\n'\n                << "capability_blocked=" << (snapshot.capabilityBlocked ? 1 : 0) << '\\n'\n                << "capability_reason=" << snapshot.capabilityReason << '\\n';'''
          if stats_writer not in hooks:
              raise SystemExit('stats writer anchor not found')
          hooks = hooks.replace(stats_writer, stats_writer_replacement, 1)

          diag_writer = '''                << " source_limit_fps=" << snapshot.sourceLimitFps\n                << " performance=" << (snapshot.performance ? 1 : 0)\n                << '\\n';'''
          diag_writer_replacement = '''                << " source_limit_fps=" << snapshot.sourceLimitFps\n                << " performance=" << (snapshot.performance ? 1 : 0)\n                << " capability_blocked=" << (snapshot.capabilityBlocked ? 1 : 0)\n                << " capability_reason=" << snapshot.capabilityReason\n                << '\\n';'''
          if diag_writer not in hooks:
              raise SystemExit('diagnostics writer anchor not found')
          hooks = hooks.replace(diag_writer, diag_writer_replacement, 1)

          publish_old = '''    void publishRuntimeState(const std::string& configFile,\n            bool active, bool generationReady, int multiplier,\n            bool performance, bool adaptive, uint32_t targetFps) {\n        queueRuntimeStats(RuntimeStatsSnapshot {\n            .configFile = configFile,\n            .active = active,\n            .generationReady = generationReady,\n            .multiplier = multiplier,\n            .adaptive = adaptive,\n            .targetFps = targetFps,\n            .sourceLimitFps = Config::activeConf.sourceFpsLimit,\n            .performance = performance,\n        });\n    }'''
          publish_new = '''    void publishRuntimeState(const std::string& configFile,\n            bool active, bool generationReady, int multiplier,\n            bool performance, bool adaptive, uint32_t targetFps,\n            bool capabilityBlocked = false,\n            const std::string& capabilityReason = {}) {\n        queueRuntimeStats(RuntimeStatsSnapshot {\n            .configFile = configFile,\n            .active = active,\n            .generationReady = generationReady,\n            .multiplier = multiplier,\n            .adaptive = adaptive,\n            .targetFps = targetFps,\n            .sourceLimitFps = Config::activeConf.sourceFpsLimit,\n            .performance = performance,\n            .capabilityBlocked = capabilityBlocked,\n            .capabilityReason = capabilityReason,\n        });\n    }'''
          if publish_old not in hooks:
              raise SystemExit('publishRuntimeState anchor not found')
          hooks = hooks.replace(publish_old, publish_new, 1)

          erase_anchor = '''        swapchainToConfiguredPresent.erase(swapchain);\n        swapchainWsiProvenance.erase(swapchain);'''
          erase_replacement = '''        swapchainToConfiguredPresent.erase(swapchain);\n        swapchainWsiProvenance.erase(swapchain);\n        passThroughSwapchains.erase(swapchain);'''
          if erase_anchor not in hooks:
              raise SystemExit('erase state anchor not found')
          hooks = hooks.replace(erase_anchor, erase_replacement, 1)

          passthrough_anchor = '''                swapchainWsiProvenance.emplace(*pSwapchain, SwapchainWsiProvenance {\n                    .gameMinImageCount = pCreateInfo->minImageCount,\n                    .effectiveMinImageCount = pCreateInfo->minImageCount,\n                    .gamePresentMode = pCreateInfo->presentMode,\n                    .effectivePresentMode = pCreateInfo->presentMode,\n                    .fgModified = false,\n                });\n#ifdef __ANDROID__\n                publishRuntimeState(activeConf.config_file, false, false,\n                    static_cast<int>(activeConf.multiplier), activeConf.performance,\n                    activeConf.adaptiveFramegen, activeConf.fpsLimit);\n#endif'''
          passthrough_replacement = '''                swapchainWsiProvenance.emplace(*pSwapchain, SwapchainWsiProvenance {\n                    .gameMinImageCount = pCreateInfo->minImageCount,\n                    .effectiveMinImageCount = pCreateInfo->minImageCount,\n                    .gamePresentMode = pCreateInfo->presentMode,\n                    .effectivePresentMode = pCreateInfo->presentMode,\n                    .fgModified = false,\n                });\n                const bool capabilityBlocked = isStructuralCapabilityBlock(reason);\n                passThroughSwapchains.insert_or_assign(*pSwapchain, PassThroughSwapchainState {\n                    .reason = reason,\n                    .capabilityBlocked = capabilityBlocked,\n                });\n#ifdef __ANDROID__\n                publishRuntimeState(activeConf.config_file, false, false,\n                    static_cast<int>(activeConf.multiplier), activeConf.performance,\n                    activeConf.adaptiveFramegen, activeConf.fpsLimit,\n                    capabilityBlocked, reason);\n#endif'''
          if passthrough_anchor not in hooks:
              raise SystemExit('createPassThrough anchor not found')
          hooks = hooks.replace(passthrough_anchor, passthrough_replacement, 1)

          context_anchor = '''            swapchainToDeviceTable.emplace(*pSwapchain, device);\n            std::cerr << "lsfg-vk: init stage=ls-context-begin images=" << imageCount'''
          context_replacement = '''            swapchainToDeviceTable.emplace(*pSwapchain, device);\n            passThroughSwapchains.erase(*pSwapchain);\n            std::cerr << "lsfg-vk: init stage=ls-context-begin images=" << imageCount'''
          if context_anchor not in hooks:
              raise SystemExit('context creation anchor not found')
          hooks = hooks.replace(context_anchor, context_replacement, 1)

          fallback_anchor = '''                swapchainWsiProvenance.emplace(*pSwapchain, SwapchainWsiProvenance {\n                    .gameMinImageCount = pCreateInfo->minImageCount,\n                    .effectiveMinImageCount = pCreateInfo->minImageCount,\n                    .gamePresentMode = pCreateInfo->presentMode,\n                    .effectivePresentMode = pCreateInfo->presentMode,\n                    .fgModified = false,\n                });\n#ifdef __ANDROID__\n                publishRuntimeState(activeConf.config_file, false, false,\n                    static_cast<int>(activeConf.multiplier), activeConf.performance,\n                    activeConf.adaptiveFramegen, activeConf.fpsLimit);\n#endif\n                std::cerr << "lsfg-vk: init stage=swapchain-fallback-pass-through"'''
          fallback_replacement = '''                swapchainWsiProvenance.emplace(*pSwapchain, SwapchainWsiProvenance {\n                    .gameMinImageCount = pCreateInfo->minImageCount,\n                    .effectiveMinImageCount = pCreateInfo->minImageCount,\n                    .gamePresentMode = pCreateInfo->presentMode,\n                    .effectivePresentMode = pCreateInfo->presentMode,\n                    .fgModified = false,\n                });\n                passThroughSwapchains.insert_or_assign(*pSwapchain, PassThroughSwapchainState {\n                    .reason = "ls-context-failed",\n                    .capabilityBlocked = false,\n                });\n#ifdef __ANDROID__\n                publishRuntimeState(activeConf.config_file, false, false,\n                    static_cast<int>(activeConf.multiplier), activeConf.performance,\n                    activeConf.adaptiveFramegen, activeConf.fpsLimit,\n                    false, "ls-context-failed");\n#endif\n                std::cerr << "lsfg-vk: init stage=swapchain-fallback-pass-through"'''
          if fallback_anchor not in hooks:
              raise SystemExit('context fallback anchor not found')
          hooks = hooks.replace(fallback_anchor, fallback_replacement, 1)

          queue_anchor = '''        if (!conf.enable || conf.multiplier <= 1)\n            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);\n\n#ifdef __ANDROID__\n        auto& runtimeStats = runtimeOutputStats[*pPresentInfo->pSwapchains];\n#endif'''
          queue_replacement = '''        if (!conf.enable || conf.multiplier <= 1)\n            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);\n\n        // An explicitly tracked pass-through swapchain is valid native WSI, not\n        // a missing LSFG context. Keep it downstream-only until a future config\n        // transition requests one serialized recreation attempt.\n        auto passThroughIt = passThroughSwapchains.find(*pPresentInfo->pSwapchains);\n        if (passThroughIt != passThroughSwapchains.end())\n            return Layer::ovkQueuePresentKHR(queue, pPresentInfo);\n\n#ifdef __ANDROID__\n        auto& runtimeStats = runtimeOutputStats[*pPresentInfo->pSwapchains];\n#endif'''
          if queue_anchor not in hooks:
              raise SystemExit('queue pass-through anchor not found')
          hooks = hooks.replace(queue_anchor, queue_replacement, 1)

          hooks_path.write_text(hooks)
          PY
      - name: Run focused native regression contracts
        run: |
          python3 tests/android_hot_reload_capability_cache_test.py
          python3 tests/android_runtime_stability_test.py
      - name: Commit production fix
        shell: bash
        run: |
          rm .github/workflows/apply-resident-hot-reload-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(android): stabilize resident hot reload and passthrough state"
          git push origin HEAD:Adaptive-Frame-Generation
