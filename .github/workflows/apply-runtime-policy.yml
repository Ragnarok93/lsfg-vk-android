name: Apply LSFG runtime policy patch

on:
  push:
    branches:
      - Adaptive-Frame-Generation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0

      - name: Apply surgical runtime policy fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_runtime_policy_patch.py
          git diff --check
          git diff -- include/runtime_policy.hpp src/context.cpp src/hooks.cpp
          git config user.name "Ragnarok93"
          git config user.email "e_fontenot1@yahoo.com"
          git add -A
          git commit -m "fix(android): separate pacing ownership and coalesce WSI invalidation"
          git push origin HEAD:Adaptive-Frame-Generation
