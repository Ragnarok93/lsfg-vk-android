name: Apply LSFG runtime policy patch

on:
  push:
    branches:
      - Adaptive-Frame-Generation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Adaptive-Frame-Generation
          fetch-depth: 0

      - name: Apply surgical runtime policy fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"{label}: start anchor not found")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"{label}: end anchor not found")
              if text.find(start, a + len(start)) >= 0 and text.find(start, a + len(start)) < b:
                  raise SystemExit(f"{label}: ambiguous start anchor")
              return text[:a] + replacement + text[b:]

          header = Path("include/runtime_policy.hpp")
          if header.exists():
              raise SystemExit("runtime_policy.hpp unexpectedly already exists")
          header.write_text(r'''#pragma once

#include <algorithm>
#include <atomic>
#include <cstdint>
#include <limits>

inline uint32_t saturatingOutputRate(uint32_t sourceFps, uint32_t multiplier) noexcept {
    if (sourceFps == 0 || multiplier <= 1)
        return 0;
    const uint64_t product = static_cast<uint64_t>(sourceFps)
        * static_cast<uint64_t>(multiplier);
    return product > std::numeric_limits<uint32_t>::max()
        ? std::numeric_limits<uint32_t>::max()
        : static_cast<uint32_t>(product);
}

// LSFG executes synchronously inside the application's present call. Output
// sleeping is therefore safe only when a separate source limiter has created a
// known frame-time budget. Fixed multiplier mode derives its cadence strictly
// from that source budget; Adaptive's target is an objective and is clamped to
// the maximum output rate the configured interpolation capacity can produce.
inline uint32_t resolveOutputPacingTarget(
        bool adaptive,
        uint32_t adaptiveTargetFps,
        uint32_t sourceFpsLimit,
        uint32_t multiplier) noexcept {
    const uint32_t capacityFps = saturatingOutputRate(sourceFpsLimit, multiplier);
    if (capacityFps == 0)
        return 0;
    if (!adaptive)
        return capacityFps;
    return std::min(adaptiveTargetFps, capacityFps);
}

// One app-visible WSI invalidation at a time. Settings written while a recreate
// is outstanding remain pending and are consumed together by the replacement
// swapchain instead of generating repeated VK_ERROR_OUT_OF_DATE_KHR storms.
class RuntimeWsiRecreateGate {
public:
    [[nodiscard]] bool inFlight() const noexcept {
        return inFlight_.load(std::memory_order_acquire);
    }

    bool requestIfNeeded(bool requiresRecreate) noexcept {
        if (!requiresRecreate)
            return false;
        bool expected = false;
        return inFlight_.compare_exchange_strong(
            expected, true, std::memory_order_acq_rel, std::memory_order_acquire);
    }

    void onSwapchainCreation() noexcept {
        inFlight_.store(false, std::memory_order_release);
    }

private:
    std::atomic<bool> inFlight_{false};
};
''')

          context_path = Path("src/context.cpp")
          context = context_path.read_text()
          context = replace_once(
              context,
              '#include "layer.hpp"\n',
              '#include "layer.hpp"\n#include "runtime_policy.hpp"\n',
              "context include")
          context = replace_once(
              context,
              '    this->outputFramePacer_.configure(conf.fpsLimit);\n',
              '    const uint32_t outputPacingTarget = resolveOutputPacingTarget(\n'
              '        conf.adaptiveFramegen, conf.fpsLimit,\n'
              '        conf.sourceFpsLimit, conf.multiplier);\n'
              '    this->outputFramePacer_.configure(outputPacingTarget);\n',
              "output pacing ownership")
          context_path.write_text(context)

          hooks_path = Path("src/hooks.cpp")
          hooks = hooks_path.read_text()
          hooks = replace_once(
              hooks,
              '#include "source_frame_pacer.hpp"\n',
              '#include "source_frame_pacer.hpp"\n#include "runtime_policy.hpp"\n',
              "hooks include")
          hooks = replace_once(
              hooks,
              '        bool pendingRequiresRecreate{};\n        std::atomic<bool> configPending{false};\n',
              '        bool pendingRequiresRecreate{};\n'
              '        RuntimeWsiRecreateGate wsiRecreateGate;\n'
              '        std::atomic<bool> configPending{false};\n',
              "runtime WSI gate state")
          hooks = replace_once(
              hooks,
              '            state.pendingRequiresRecreate = false;\n            state.configPending.store(false, std::memory_order_release);\n',
              '            state.pendingRequiresRecreate = false;\n'
              '            state.wsiRecreateGate.onSwapchainCreation();\n'
              '            state.configPending.store(false, std::memory_order_release);\n',
              "watcher gate reset")

          start = '    PendingConfigAction applyPendingRuntimeConfig() {'
          end = '    bool applyPendingConfigForSwapchainCreation() {'
          replacement = r'''    PendingConfigAction applyPendingRuntimeConfig() {
        auto& state = runtimeIoState();
        if (!state.configPending.load(std::memory_order_acquire))
            return PendingConfigAction::None;

        // Once OUT_OF_DATE has been returned, leave all subsequent writes
        // pending until the replacement swapchain consumes the newest config.
        // This is a lock-free hot-path check while recreation is outstanding.
        if (state.wsiRecreateGate.inFlight())
            return PendingConfigAction::None;

        std::lock_guard lock(state.mutex);
        if (!state.pendingConfig.has_value()) {
            state.configPending.store(false, std::memory_order_release);
            return PendingConfigAction::None;
        }
        if (state.pendingRequiresRecreate) {
            return state.wsiRecreateGate.requestIfNeeded(true)
                ? PendingConfigAction::Recreate
                : PendingConfigAction::None;
        }

        Config::activeConf = *state.pendingConfig;
        state.appliedConf = Config::activeConf;
        state.pendingConfig.reset();
        state.pendingRequiresRecreate = false;
        state.configPending.store(false, std::memory_order_release);
        std::cerr << "lsfg-vk: runtime stage=config-applied-no-wsi-recreate"
                  << " adaptive=" << (Config::activeConf.adaptiveFramegen ? 1 : 0)
                  << " targetFps=" << Config::activeConf.fpsLimit
                  << " sourceFpsLimit=" << Config::activeConf.sourceFpsLimit << "\n";
        return PendingConfigAction::Applied;
    }

'''
          hooks = replace_between(hooks, start, end, replacement, "single-flight runtime config")

          start = '    bool applyPendingConfigForSwapchainCreation() {'
          end = '    void queueRuntimeStats(RuntimeStatsSnapshot snapshot) {'
          replacement = r'''    bool applyPendingConfigForSwapchainCreation() {
        auto& state = runtimeIoState();
        std::lock_guard lock(state.mutex);
        if (!state.pendingConfig.has_value()) {
            state.configPending.store(false, std::memory_order_release);
            state.wsiRecreateGate.onSwapchainCreation();
            return false;
        }
        const auto previousConf = Config::activeConf;
        Config::activeConf = *state.pendingConfig;
        const bool requiredRecreate = requiresSwapchainRecreation(
            previousConf, Config::activeConf);
        state.appliedConf = Config::activeConf;
        state.pendingConfig.reset();
        state.pendingRequiresRecreate = false;
        state.configPending.store(false, std::memory_order_release);
        // Clear only after the newest coalesced config is installed, so no
        // present thread can launch a second invalidation during consumption.
        state.wsiRecreateGate.onSwapchainCreation();
        std::cerr << "lsfg-vk: init stage=config-applied-for-swapchain"
                  << " multiplier=" << Config::activeConf.multiplier
                  << " adaptive=" << (Config::activeConf.adaptiveFramegen ? 1 : 0)
                  << " targetFps=" << Config::activeConf.fpsLimit
                  << " sourceFpsLimit=" << Config::activeConf.sourceFpsLimit
                  << " presentMode=" << Config::activeConf.e_present
                  << " enabled=" << (Config::activeConf.enable ? 1 : 0)
                  << " wsiChanged=" << (requiredRecreate ? 1 : 0) << "\n";
        return true;
    }

'''
          hooks = replace_between(hooks, start, end, replacement, "coalesced swapchain config")
          hooks_path.write_text(hooks)

          # The helper is intentionally one-shot; production history must not
          # retain a workflow whose purpose is to mutate source code.
          Path('.github/workflows/apply-runtime-policy.yml').unlink()
          PY

          git diff --check
          git diff -- include/runtime_policy.hpp src/context.cpp src/hooks.cpp tests/output_frame_pacer_test.cpp
          git config user.name "Ragnarok93"
          git config user.email "e_fontenot1@yahoo.com"
          git add include/runtime_policy.hpp src/context.cpp src/hooks.cpp .github/workflows/apply-runtime-policy.yml
          git commit -m "fix(android): separate pacing ownership and coalesce WSI invalidation"
          git push origin HEAD:Adaptive-Frame-Generation
